<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Memory ✨</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #gate { position: fixed; inset: 0; background: #000; z-index: 200; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        .btn { background: white; color: black; padding: 20px 40px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; }
        
        #ui { position: absolute; top: 30px; width: 100%; text-align: center; color: white; z-index: 10; pointer-events: none; }
        #status { font-weight: 300; font-size: 0.8rem; letter-spacing: 4px; text-transform: uppercase; opacity: 0.7; }
        
        #video-container { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 90px; border-radius: 10px; overflow: hidden; opacity: 0.3; transform: scaleX(-1); border: 1px solid white; }
        video { width: 100%; height: 100%; object-fit: cover; }

        #hint { position: fixed; bottom: 10%; width: 100%; text-align: center; color: #fff; z-index: 5; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="gate">
        <h1 style="letter-spacing: 15px; font-weight: 100; margin-bottom: 50px;">ETERNITY</h1>
        <button class="btn" onclick="initExperience()">Open the Rift 🎁</button>
    </div>

    <div id="ui">
        <div id="status">WAITING FOR YOUR TOUCH...</div>
    </div>

    <div id="hint">Bring both hands together to start</div>

    <div id="video-container"><video id="input_video"></video></div>
    <audio id="song" src="1.mp3" loop></audio>

    <script>
        let scene, camera, renderer, particles, starField;
        let handL = new THREE.Vector3(), handR = new THREE.Vector3();
        let currentMode = 'sphere'; // sphere, text, photo1, photo2
        let transitionProgress = 0;
        let isExploded = false;
        const PARTICLE_COUNT = 10000;
        
        // Target buffers
        let posTarget, colorTarget;
        const img1Data = [], img2Data = [];

        async function initExperience() {
            document.getElementById('gate').style.display = 'none';
            document.getElementById('song').play().catch(() => {});
            
            // Preload Photos
            const [data1, data2] = await Promise.all([
                loadImageData('a.png'),
                loadImageData('https://raw.githubusercontent.com/alwaysvivek/rishubaby/main/abc.JPG')
            ]);
            
            setupThree(data1, data2);
            initTracking();
        }

        function loadImageData(url) {
            return new Promise(resolve => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.src = url;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 100; canvas.height = 100;
                    ctx.drawImage(img, 0, 0, 100, 100);
                    resolve(ctx.getImageData(0, 0, 100, 100).data);
                };
            });
        }

        function setupThree(d1, d2) {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 50;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            posTarget = new Float32Array(PARTICLE_COUNT * 3);
            colorTarget = new Float32Array(PARTICLE_COUNT * 3);

            for(let i=0; i<PARTICLE_COUNT; i++) {
                // Initial State: Tiny dense core
                positions[i*3] = (Math.random()-0.5)*2;
                positions[i*3+1] = (Math.random()-0.5)*2;
                positions[i*3+2] = (Math.random()-0.5)*2;
                
                colors[i*3] = 1; colors[i*3+1] = 1; colors[i*3+2] = 1;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const mat = new THREE.PointsMaterial({ size: 0.25, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending });
            particles = new THREE.Points(geo, mat);
            scene.add(particles);

            // Stars
            const starGeo = new THREE.BufferGeometry();
            const starPos = new Float32Array(3000 * 3);
            for(let i=0; i<9000; i++) starPos[i] = (Math.random()-0.5) * 600;
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            starField = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0x444444, size: 0.2}));
            scene.add(starField);

            particles.userData = { d1, d2 };
            animate();
        }

        function updateTargets(mode) {
            const d1 = particles.userData.d1;
            const d2 = particles.userData.d2;
            
            for(let i=0; i<PARTICLE_COUNT; i++) {
                let x, y, z, r, g, b;
                
                if (mode === 'sphere') {
                    const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
                    const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
                    x = 12 * Math.cos(theta) * Math.sin(phi);
                    y = 12 * Math.sin(theta) * Math.sin(phi);
                    z = 12 * Math.cos(phi);
                    r=1; g=1; b=1;
                } 
                else if (mode === 'photo1' || mode === 'photo2') {
                    const data = mode === 'photo1' ? d1 : d2;
                    x = (i % 100) - 50;
                    y = 50 - Math.floor(i / 100);
                    z = 0;
                    r = data[i*4]/255; g = data[i*4+1]/255; b = data[i*4+2]/255;
                }

                posTarget[i*3] = x * 0.5;
                posTarget[i*3+1] = y * 0.5;
                posTarget[i*3+2] = z * 0.5;
                colorTarget[i*3] = r;
                colorTarget[i*3+1] = g;
                colorTarget[i*3+2] = b;
            }
        }

        function initTracking() {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5 });

            hands.onResults(results => {
                const status = document.getElementById('status');
                const hint = document.getElementById('hint');

                if (results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
                    const h1 = results.multiHandLandmarks[0][9];
                    const h2 = results.multiHandLandmarks[1][9];
                    
                    const dist = Math.hypot(h1.x - h2.x, h1.y - h2.y);
                    
                    // Zoom logic based on hand depth (average z)
                    const depth = (h1.z + h2.z) / 2;
                    camera.position.z = 30 + (depth * 100);

                    if (!isExploded && dist > 0.4) {
                        isExploded = true;
                        currentMode = 'photo1';
                        updateTargets('photo1');
                        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                        status.innerText = "YOU UNLOCKED THE COSMOS";
                        hint.innerText = "Clap to compress | Move hands to zoom";
                    } 
                    else if (isExploded && dist < 0.1) {
                        // Clap/Compress effect
                        currentMode = 'sphere';
                        updateTargets('sphere');
                        status.innerText = "COSMIC COMPRESSION";
                    }
                    else if (isExploded && dist > 0.6) {
                        // Wide stretch triggers second photo
                        currentMode = 'photo2';
                        updateTargets('photo2');
                        status.innerText = "BEYOND THE INFINITE";
                    }
                }
            });

            const cameraPipe = new Camera(document.getElementById('input_video'), {
                onFrame: async () => { await hands.send({image: document.getElementById('input_video')}); },
                width: 480, height: 360
            });
            cameraPipe.start();
        }

        function animate() {
            requestAnimationFrame(animate);
            const pos = particles.geometry.attributes.position;
            const col = particles.geometry.attributes.color;

            for(let i=0; i<PARTICLE_COUNT*3; i++) {
                pos.array[i] += (posTarget[i] - pos.array[i]) * 0.08;
                col.array[i] += (colorTarget[i] - col.array[i]) * 0.08;
            }
            
            pos.needsUpdate = true;
            col.needsUpdate = true;
            
            starField.rotation.y += 0.001;
            particles.rotation.y += 0.002;
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
