<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Gesture Morph - Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; z-index: 10; pointer-events: none; }
        #status { font-weight: bold; font-size: 1.4rem; color: #00d4ff; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .guide { font-size: 13px; opacity: 0.8; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; border: 1px solid #444; }
        #video-container { position: absolute; bottom: 20px; right: 20px; width: 180px; height: 135px; border: 2px solid #00d4ff; border-radius: 10px; overflow: hidden; transform: scaleX(-1); }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="status">Scanning Gestures...</div>
        <div class="guide">
            🤟 <b>I Love You:</b> Heart Shape<br>
            ✊ <b>Fist:</b> Sphere Shape<br>
            🖐 <b>Open Palm:</b> Plane Grid<br>
            ✌️ <b>Peace:</b> Five-Point Star<br>
            ☝️ <b>Point Up:</b> Tornado Spiral<br>
            👏 <b>2-Hand Clap:</b> Shrink/Vanish
        </div>
    </div>

    <div id="video-container"><video id="input_video"></video></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        const PARTICLE_COUNT = 8000;
        let scene, camera, renderer, particleSystem, glitterSystem;
        let currentShape = 'heart';
        let targetScale = 1;

        // --- Shape Definitions ---
        const getPositions = {
            heart: (i) => {
                const t = Math.random() * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                return new THREE.Vector3(x * 0.4, y * 0.4, (Math.random()-0.5) * 2);
            },
            sphere: (i) => {
                const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
                const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
                return new THREE.Vector3(Math.cos(theta)*Math.sin(phi), Math.sin(theta)*Math.sin(phi), Math.cos(phi)).multiplyScalar(7);
            },
            plane: (i) => {
                const x = (i % 90) - 45;
                const y = Math.floor(i / 90) - 45;
                return new THREE.Vector3(x * 0.3, y * 0.3, 0);
            },
            star: (i) => {
                const t = Math.random() * Math.PI * 2;
                const r = (i % 2 === 0 ? 10 : 4) * Math.random();
                const arms = 5;
                const angle = Math.floor(Math.random() * arms) * (Math.PI * 2 / arms);
                return new THREE.Vector3(Math.cos(angle + t*0.1) * r, Math.sin(angle + t*0.1) * r, (Math.random()-0.5)*2);
            },
            tornado: (i) => {
                const angle = 0.1 * i;
                const r = i / 400;
                return new THREE.Vector3(Math.cos(angle)*r, (i/400) - 10, Math.sin(angle)*r);
            }
        };

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 20;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            const targetPos = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);

            for(let i=0; i<PARTICLE_COUNT; i++) {
                const p = getPositions.heart(i);
                pos[i*3] = p.x; pos[i*3+1] = p.y; pos[i*3+2] = p.z;
                targetPos[i*3] = p.x; targetPos[i*3+1] = p.y; targetPos[i*3+2] = p.z;
                colors[i*3] = 1; colors[i*3+1] = 0.2; colors[i*3+2] = 0.5;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('targetPos', new THREE.BufferAttribute(targetPos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({ size: 0.15, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true });
            particleSystem = new THREE.Points(geo, mat);
            scene.add(particleSystem);

            // Glitter
            const gGeo = new THREE.BufferGeometry();
            gGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(500 * 3), 3));
            glitterSystem = new THREE.Points(gGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.05}));
            scene.add(glitterSystem);
        }

        function morphTo(shapeName, r, g, b) {
            if (currentShape === shapeName) return;
            currentShape = shapeName;
            const targetAttr = particleSystem.geometry.attributes.targetPos;
            const colorAttr = particleSystem.geometry.attributes.color;
            for(let i=0; i<PARTICLE_COUNT; i++) {
                const p = getPositions[shapeName](i);
                targetAttr.array[i*3] = p.x;
                targetAttr.array[i*3+1] = p.y;
                targetAttr.array[i*3+2] = p.z;
                colorAttr.array[i*3] = r; colorAttr.array[i*3+1] = g; colorAttr.array[i*3+2] = b;
            }
            targetAttr.needsUpdate = true;
            colorAttr.needsUpdate = true;
        }

        function initTracking() {
            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7 });

            hands.onResults(results => {
                const status = document.getElementById('status');
                if (!results.multiHandLandmarks.length) return;

                results.multiHandLandmarks.forEach((hand, idx) => {
                    const isIndexUp = hand[8].y < hand[6].y;
                    const isMiddleUp = hand[12].y < hand[10].y;
                    const isRingUp = hand[16].y < hand[14].y;
                    const isPinkyUp = hand[20].y < hand[18].y;
                    const isThumbUp = hand[4].x < hand[3].x; // Simplified

                    // Logic for Gestures
                    if (isIndexUp && isPinkyUp && !isMiddleUp && !isRingUp) {
                        status.innerText = "💖 I LOVE YOU";
                        morphTo('heart', 1, 0.1, 0.5);
                    } else if (!isIndexUp && !isMiddleUp && !isRingUp && !isPinkyUp) {
                        status.innerText = "✊ FIST - SPHERE";
                        morphTo('sphere', 0, 0.8, 1);
                    } else if (isIndexUp && isMiddleUp && isRingUp && isPinkyUp) {
                        status.innerText = "🖐 PALM - PLANE";
                        morphTo('plane', 0.5, 1, 0.5);
                    } else if (isIndexUp && isMiddleUp && !isRingUp && !isPinkyUp) {
                        status.innerText = "✌️ PEACE - STAR";
                        morphTo('star', 1, 0.8, 0);
                    } else if (isIndexUp && !isMiddleUp && !isRingUp && !isPinkyUp) {
                        status.innerText = "☝️ POINT - TORNADO";
                        morphTo('tornado', 0.7, 0.3, 1);
                    }
                });

                if (results.multiHandLandmarks.length === 2) {
                    const d = Math.hypot(results.multiHandLandmarks[0][9].x - results.multiHandLandmarks[1][9].x, results.multiHandLandmarks[0][9].y - results.multiHandLandmarks[1][9].y);
                    targetScale = THREE.MathUtils.mapLinear(d, 0.1, 0.6, 0, 2);
                }
            });

            const cameraPipe = new Camera(document.getElementById('input_video'), {
                onFrame: async () => { await hands.send({image: document.getElementById('input_video')}); },
                width: 640, height: 480
            });
            cameraPipe.start();
        }

        function animate() {
            requestAnimationFrame(animate);
            const pos = particleSystem.geometry.attributes.position;
            const target = particleSystem.geometry.attributes.targetPos;

            for(let i=0; i<PARTICLE_COUNT*3; i++) {
                pos.array[i] += (target.array[i] - pos.array[i]) * 0.1;
            }
            pos.needsUpdate = true;
            particleSystem.rotation.y += 0.005;
            particleSystem.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);
            renderer.render(scene, camera);
        }

        initThree();
        initTracking();
        animate();
    </script>
</body>
</html>
