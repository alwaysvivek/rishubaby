<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Screen Break</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #video { position: absolute; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; transform: scaleX(-1); }
        #crackCanvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        
        #message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 5rem; font-weight: 900; opacity: 0;
            transition: opacity 2s ease-in; z-index: 100; text-shadow: 0 0 20px #ff0055;
        }

        #ui {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: white; background: rgba(0,0,0,0.8); padding: 12px 25px;
            border-radius: 30px; z-index: 101; border: 1px solid #444;
        }

        /* Hardware Glitch Effect */
        .shatter-flash {
            animation: flash 0.3s ease-out;
        }
        @keyframes flash {
            0% { filter: brightness(5) contrast(2); transform: scale(1.05); }
            100% { filter: brightness(1) contrast(1); transform: scale(1); }
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <canvas id="crackCanvas"></canvas>
    <div id="ui">Checking Camera... Move nose close to screen</div>
    <div id="message">i love u</div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script type="module">
        const video = document.getElementById('video');
        const canvas = document.getElementById('crackCanvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('ui');
        const message = document.getElementById('message');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let isCracked = false;

        // 1. Initialize Face Tracking
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });

        faceMesh.onResults((results) => {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks[0] && !isCracked) {
                ui.innerText = "Target locked... move closer!";
                const nose = results.multiFaceLandmarks[0][1];
                
                // ADJUSTED SENSITIVITY: -0.08 is easier to trigger than -0.15
                if (nose.z < -0.09) { 
                    triggerShatter(nose.x * canvas.width, nose.y * canvas.height);
                }
            }
        });

        // 2. Start Video
        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
            video.srcObject = stream;
            const predict = async () => {
                await faceMesh.send({ image: video });
                requestAnimationFrame(predict);
            };
            predict();
        }).catch(err => {
            ui.innerText = "Camera Error: Please allow access.";
        });

        // 3. The Shatter Logic
        function triggerShatter(x, y) {
            isCracked = true;
            ui.style.display = 'none';
            document.body.classList.add('shatter-flash');

            // Play Sound
            const audio = new Audio('https://www.soundjay.com/misc/sounds/glass-break-1.mp3');
            audio.play().catch(e => console.log("Audio needs user interaction first"));

            // Draw "Impact Hole"
            ctx.fillStyle = "black";
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.fill();

            // Draw Main Fracture Lines
            ctx.strokeStyle = "rgba(255,255,255,0.7)";
            ctx.lineWidth = 1;
            for (let i = 0; i < 30; i++) {
                drawFracture(x, y, Math.random() * Math.PI * 2, 4 + Math.random() * 8);
            }

            // Draw Rainbow LCD Bleed Lines
            const colors = ['#00ffff', '#ff00ff', '#ffffff', '#000000'];
            for (let i = 0; i < 15; i++) {
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                ctx.globalAlpha = 0.5;
                ctx.fillRect(x + (Math.random() - 0.5) * 400, 0, 2, canvas.height);
            }

            setTimeout(() => { message.style.opacity = "1"; }, 500);
        }

        function drawFracture(startX, startY, angle, segments) {
            let currX = startX;
            let currY = startY;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            for (let i = 0; i < segments; i++) {
                currX += Math.cos(angle) * (20 + Math.random() * 50);
                currY += Math.sin(angle) * (20 + Math.random() * 50);
                angle += (Math.random() - 0.5) * 1; 
                ctx.lineTo(currX, currY);
            }
            ctx.stroke();
        }
    </script>
</body>
</html>
