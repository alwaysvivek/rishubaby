<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Crack Surprise</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        
        /* Video mirrored to feel natural */
        #video { 
            position: absolute; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: 1; transform: scaleX(-1); 
        }

        /* The Overlay for the crack and text */
        #overlay {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 10; pointer-events: none;
        }

        #message {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white; font-size: 5rem; font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 0, 100, 0.8);
            opacity: 0; transition: opacity 1.5s ease-in;
            z-index: 11;
        }

        #ui {
            position: absolute; top: 20px; left: 20px;
            color: white; background: rgba(0,0,0,0.6);
            padding: 10px; border-radius: 8px; z-index: 100;
        }

        .crack-svg {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            filter: drop-shadow(0px 0px 2px rgba(255,255,255,0.5));
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <div id="ui">Get ready... Move your head close to the screen!</div>
    <div id="message">i love u</div>
    
    <div id="overlay">
        <svg id="crack-container" class="crack-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
            </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script type="module">
        const video = document.getElementById('video');
        const ui = document.getElementById('ui');
        const message = document.getElementById('message');
        const crackContainer = document.getElementById('crack-container');

        let isCracked = false;

        // --- 1. Face Tracking Setup ---
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults((results) => {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks[0] && !isCracked) {
                const nose = results.multiFaceLandmarks[0][1]; // Nose tip
                
                // MediaPipe Z is depth. Smaller values = closer to camera.
                // We detect a "headbutt" if Z drops below a threshold (e.g., -0.1)
                if (nose.z < -0.12) { 
                    triggerCrack(nose.x * 100, nose.y * 100);
                }
            }
        });

        // --- 2. Camera Start ---
        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
            video.srcObject = stream;
            const predict = async () => {
                await faceMesh.send({ image: video });
                requestAnimationFrame(predict);
            };
            predict();
        });

        // --- 3. Crack Animation & Surprise ---
        function triggerCrack(x, y) {
            isCracked = true;
            ui.style.display = 'none';

            // Create procedural crack paths
            for (let i = 0; i < 8; i++) {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const length = 20 + Math.random() * 30;
                const angle = (i / 8) * Math.PI * 2 + (Math.random() * 0.5);
                
                const xEnd = x + Math.cos(angle) * length;
                const yEnd = y + Math.sin(angle) * length;

                // Jagged line logic
                const midX = x + Math.cos(angle) * (length/2) + (Math.random() - 0.5) * 5;
                const midY = y + Math.sin(angle) * (length/2) + (Math.random() - 0.5) * 5;

                const d = `M ${x} ${y} L ${midX} ${midY} L ${xEnd} ${yEnd}`;
                
                line.setAttribute("d", d);
                line.setAttribute("stroke", "rgba(255,255,255,0.8)");
                line.setAttribute("stroke-width", "0.5");
                line.setAttribute("fill", "none");
                crackContainer.appendChild(line);
            }

            // Show Message
            setTimeout(() => {
                message.style.opacity = "1";
            }, 300);
        }
    </script>
</body>
</html>
