<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Shatter Screen</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #video { position: absolute; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; transform: scaleX(-1); }
        #crackCanvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        
        #message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 5rem; font-weight: 900; opacity: 0;
            transition: opacity 2s ease-in; z-index: 100; text-shadow: 0 0 20px #ff0055, 0 0 30px #00ffff;
            letter-spacing: 5px; text-transform: uppercase;
        }

        #ui {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: white; background: rgba(0,0,0,0.8); padding: 12px 25px;
            border-radius: 30px; z-index: 101; border: 1px solid #444;
        }

        /* Hardware Glitch Effect on hit */
        .shatter-flash {
            animation: flash 0.3s ease-out;
        }
        @keyframes flash {
            0% { filter: brightness(3) contrast(1.5) hue-rotate(20deg); transform: scale(1.02); }
            100% { filter: brightness(1) contrast(1) hue-rotate(0deg); transform: scale(1); }
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <canvas id="crackCanvas"></canvas>
    <div id="ui">Checking Camera... Prepare to smash!</div>
    <div id="message">i love u</div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script type="module">
        const video = document.getElementById('video');
        const canvas = document.getElementById('crackCanvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('ui');
        const message = document.getElementById('message');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let lastShatterTime = 0;
        const shatterCooldown = 1500; // 1.5 seconds cooldown between smashes
        let hitCount = 0;
        const maxHits = 5; // How many times you can smash before the final message

        // 1. Initialize Face Tracking
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });

        faceMesh.onResults((results) => {
            const currentTime = Date.now();
            if (results.multiFaceLandmarks && results.multiFaceLandmarks[0] && hitCount < maxHits) {
                ui.innerText = `Target locked... Smash the screen! (${hitCount}/${maxHits})`;
                const nose = results.multiFaceLandmarks[0][1];
                
                // Adjusted Sensitivity and Cooldown
                if (nose.z < -0.09 && (currentTime - lastShatterTime > shatterCooldown)) { 
                    lastShatterTime = currentTime;
                    hitCount++;
                    triggerShatter(nose.x * canvas.width, nose.y * canvas.height);
                }
            } else if (hitCount >= maxHits) {
                 ui.innerText = "Screen completely broken!";
                 if (message.style.opacity === '0') {
                    message.style.opacity = '1';
                 }
            } else {
                 ui.innerText = "No face detected. Adjust lighting or position.";
            }
        });

        // 2. Start Video
        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
            video.srcObject = stream;
            const predict = async () => {
                await faceMesh.send({ image: video });
                requestAnimationFrame(predict);
            };
            predict();
        }).catch(err => {
            ui.innerText = "Camera Error: Please allow access.";
            console.error("Camera access error:", err);
        });

        // 3. The Shatter Logic for multiple hits
        function triggerShatter(x, y) {
            document.body.classList.remove('shatter-flash'); // Reset animation
            void document.body.offsetWidth; // Trigger reflow to restart animation
            document.body.classList.add('shatter-flash');

            // Play Sound - only if not too many hits already
            if (hitCount < maxHits) {
                const audio = new Audio('https://www.soundjay.com/misc/sounds/glass-break-1.mp3');
                audio.volume = 0.7;
                audio.play().catch(e => console.log("Audio needs user interaction or was blocked:", e));
            }


            // --- NEW: Small circular glass crack effect ---
            drawCircularCrack(x, y, 30 + Math.random() * 15); // Random size for variation


            // Draw "Impact Hole" (more subtle now as circular cracks are primary)
            ctx.fillStyle = "rgba(0,0,0,0.8)";
            ctx.beginPath();
            ctx.arc(x, y, 10, 0, Math.PI * 2);
            ctx.fill();

            // Draw Main Fracture Lines (more subtle and varied per hit)
            ctx.strokeStyle = `rgba(255,255,255,${0.5 + Math.random() * 0.3})`;
            ctx.lineWidth = 0.8 + Math.random() * 0.5;
            for (let i = 0; i < 15 + Math.random() * 10; i++) {
                drawFracture(x, y, Math.random() * Math.PI * 2, 3 + Math.random() * 5);
            }

            // Draw Randomized Dead Pixels (accumulate over hits)
            drawDeadPixels(x, y);

            // Draw Rainbow LCD Bleed Lines (accumulate over hits)
            if (hitCount % 2 === 0) { // Add new bleed lines every other hit
                const colors = ['#00ffff', '#ff00ff', '#ffffff', '#000000', '#ff8800'];
                for (let i = 0; i < 5; i++) {
                    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                    ctx.globalAlpha = 0.4 + Math.random() * 0.3;
                    ctx.fillRect(x + (Math.random() - 0.5) * 300, 0, 1 + Math.random() * 2, canvas.height);
                }
            }
        }

        // Draws a small, circular web of cracks
        function drawCircularCrack(centerX, centerY, radius) {
            ctx.strokeStyle = "rgba(255,255,255,0.8)";
            ctx.lineWidth = 0.6;

            // Concentric circles
            for(let r = radius * 0.3; r < radius; r += radius / 5) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Radial cracks from center
            for(let i = 0; i < 10; i++) {
                let angle = Math.random() * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + Math.cos(angle) * radius * (0.8 + Math.random() * 0.2), 
                           centerY + Math.sin(angle) * radius * (0.8 + Math.random() * 0.2));
                ctx.stroke();
            }
        }

        // Draws a single fracture line, making it jagged
        function drawFracture(startX, startY, angle, segments) {
            let currX = startX;
            let currY = startY;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            for (let i = 0; i < segments; i++) {
                currX += Math.cos(angle) * (30 + Math.random() * 60); // Longer segments
                currY += Math.sin(angle) * (30 + Math.random() * 60);
                angle += (Math.random() - 0.5) * 0.7; // More jagged turns
                ctx.lineTo(currX, currY);
            }
            ctx.stroke();
        }

        // Adds random "dead" pixels around the impact
        function drawDeadPixels(x, y) {
            ctx.fillStyle = "black";
            ctx.globalAlpha = 0.9;
            for (let i = 0; i < 50; i++) { // More dead pixels per hit
                const pixelX = x + (Math.random() - 0.5) * 100;
                const pixelY = y + (Math.random() - 0.5) * 100;
                const pixelSize = 1 + Math.random() * 2;
                ctx.fillRect(pixelX, pixelY, pixelSize, pixelSize);
            }
        }
    </script>
</body>
</html>
