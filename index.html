<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishu's World | Hand Tracking</title>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: -apple-system, sans-serif; }
        canvas { display: block; }
        
        #gate {
            position: fixed; inset: 0; background: #000; z-index: 100;
            display: flex; justify-content: center; align-items: center;
        }
        
        .btn {
            background: #fff; color: #000; border: none; padding: 20px 40px;
            border-radius: 50px; font-weight: bold; cursor: pointer;
            letter-spacing: 2px; text-transform: uppercase; transition: 0.3s;
        }

        #ui-layer {
            position: fixed; top: 10%; width: 100%; text-align: center;
            pointer-events: none; color: white; z-index: 10;
        }

        #compliment { color: #ff69b4; font-size: 1.5rem; margin-top: 20px; height: 30px; }

        .floating-img {
            position: fixed; width: 150px; height: 150px; border-radius: 15px;
            object-fit: cover; border: 3px solid white; display: none;
            box-shadow: 0 0 30px rgba(255,105,180,0.5);
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        #hint {
            position: fixed; bottom: 30px; width: 100%; text-align: center;
            color: rgba(255,255,255,0.4); font-size: 0.7rem; letter-spacing: 3px;
        }

        video { transform: scaleX(-1); visibility: hidden; position: absolute; }
    </style>
</head>
<body>

    <div id="gate">
        <button class="btn" onclick="startApp()">Enter Rishu's World</button>
    </div>

    <div id="ui-layer">
        <h1 id="title" style="letter-spacing: 10px; font-weight: 200;">RISHUBARBIE</h1>
        <div id="compliment"></div>
    </div>

    <img id="imgA" src="https://github.com/alwaysvivek/rishubaby/blob/main/a.png?raw=true" class="floating-img" style="left: 10%;">
    <img id="imgABC" src="https://github.com/alwaysvivek/rishubaby/blob/main/abc.JPG?raw=true" class="floating-img" style="right: 10%;">

    <div id="hint">PINCH TO COLLECT • SPREAD FOR BRIDGE • OPEN TO SCATTER</div>

    <video id="webcam" autoplay playsinline></video>
    <audio id="bgMusic" src="https://github.com/alwaysvivek/rishubaby/blob/main/1.mp3?raw=true" loop></audio>

    <script>
        const COMPLIMENTS = ["Meri Rabbit 🐰", "Rishubabu 😽", "Cutiepie 🥧", "Rishubarbie 🎀", "Mumbai ✈️ Delhi", "Jaan ✨"];
        let scene, camera, renderer, particles, particleData = [];
        let handX = 0, handY = 0, currentGesture = "NONE";
        
        const count = 2000;
        const dummy = new THREE.Object3D();

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const geo = new THREE.SphereGeometry(0.1, 8, 8);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff69b4, emissive: 0xff1493 });
            particles = new THREE.InstancedMesh(geo, mat, count);

            for (let i = 0; i < count; i++) {
                particleData.push({
                    t: Math.random() * 100,
                    speed: 0.01 + Math.random() / 50,
                    radius: 5 + Math.random() * 5,
                    offset: new THREE.Vector3((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10)
                });
            }

            const light = new THREE.PointLight(0xffffff, 1);
            light.position.set(5, 5, 5);
            scene.add(light, new THREE.AmbientLight(0x404040), particles);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            particleData.forEach((p, i) => {
                p.t += p.speed;
                let x = Math.cos(p.t) * p.radius;
                let y = Math.sin(p.t) * p.radius;
                let z = Math.sin(p.t * 0.5) * 5;

                if (currentGesture === "PINCH") {
                    x = THREE.MathUtils.lerp(x, handX + p.offset.x * 0.2, 0.1);
                    y = THREE.MathUtils.lerp(y, handY + p.offset.y * 0.2, 0.1);
                } else if (currentGesture === "BRIDGE") {
                    const progress = i / count;
                    x = THREE.MathUtils.lerp(-15, 15, progress);
                    y = Math.sin(time + i * 0.1) * 2;
                    z = 0;
                } else if (currentGesture === "OPEN") {
                    x += p.offset.x * 2;
                    y += p.offset.y * 2;
                }

                dummy.position.set(x, y, z);
                dummy.scale.setScalar(Math.sin(p.t) * 0.1 + 0.1);
                dummy.updateMatrix();
                particles.setMatrixAt(i, dummy.matrix);
            });

            particles.instanceMatrix.needsUpdate = true;
            renderer.render(scene, camera);
        }

        function startApp() {
            document.getElementById('gate').style.display = 'none';
            document.getElementById('bgMusic').play();
            initThree();
            setupMediaPipe();
            animate();
        }

        function setupMediaPipe() {
            const videoElement = document.getElementById('webcam');
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const marks = results.multiHandLandmarks[0];
                    handX = (0.5 - marks[8].x) * 30; // Inverse X for mirroring
                    handY = (0.5 - marks[8].y) * 20;

                    const thumb = marks[4], index = marks[8], pinky = marks[20];
                    const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
                    const bridgeDist = Math.abs(pinky.x - thumb.x);

                    if (pinchDist < 0.05) {
                        currentGesture = "PINCH";
                        document.getElementById('title').innerText = "HOLDING YOU";
                        if(Math.random() > 0.98) document.getElementById('compliment').innerText = COMPLIMENTS[Math.floor(Math.random()*COMPLIMENTS.length)];
                    } else if (bridgeDist > 0.45) {
                        currentGesture = "BRIDGE";
                        document.getElementById('title').innerText = "MUMBAI ❤️ DELHI";
                        document.querySelectorAll('.floating-img').forEach(el => el.style.display = 'block');
                    } else {
                        currentGesture = "NONE";
                        document.getElementById('title').innerText = "RISHUBARBIE";
                        document.querySelectorAll('.floating-img').forEach(el => el.style.display = 'none');
                    }
                }
            });

            const cameraPipe = new Camera(videoElement, {
                onFrame: async () => { await hands.send({ image: videoElement }); },
                width: 640, height: 480
            });
            cameraPipe.start();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
