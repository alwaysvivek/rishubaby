<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Hardware Failure</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        
        /* Mirroring and base video styling */
        #video { 
            position: absolute; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: 1; transform: scaleX(-1);
        }

        /* Glass Surface Grit & Dust Overlay */
        #texture-overlay {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 15; pointer-events: none;
            opacity: 0.1;
            background-image: url('https://www.transparenttextures.com/patterns/glass-pass.png');
            mix-blend-mode: screen;
            transition: opacity 0.5s ease;
        }

        /* The Crack Layers */
        #crackCanvas { 
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100vh; z-index: 10; pointer-events: none; 
            filter: drop-shadow(0px 0px 1.5px rgba(255,255,255,0.8));
        }
        
        #message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 5rem; font-weight: 900; opacity: 0;
            z-index: 100; text-shadow: 0 0 20px #ff0055, 0 0 60px #ff0055;
            letter-spacing: 15px; text-transform: uppercase; pointer-events: none;
        }

        #ui {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: #0f0; background: rgba(0,0,0,0.9); padding: 12px 24px;
            border-radius: 2px; z-index: 101; border: 1px solid #0f0;
            text-transform: uppercase; font-size: 0.8rem; letter-spacing: 4px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        /* Animation for hits */
        .impact-shake {
            animation: glitch-shake 0.2s infinite;
        }

        @keyframes glitch-shake {
            0% { transform: translate(0,0) scaleX(-1); filter: contrast(3) brightness(2); }
            25% { transform: translate(-5px, 5px) scaleX(-1.05); filter: hue-rotate(90deg); }
            50% { transform: translate(5px, -5px) scaleX(-0.95); filter: invert(0.2); }
            100% { transform: translate(0,0) scaleX(-1); }
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <div id="texture-overlay"></div>
    <canvas id="crackCanvas"></canvas>
    <div id="ui">SENSOR ACTIVE: BRING FACE CLOSER</div>
    <div id="message">i love u</div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script type="module">
        const video = document.getElementById('video');
        const canvas = document.getElementById('crackCanvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('ui');
        const message = document.getElementById('message');
        const overlay = document.getElementById('texture-overlay');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let hitCount = 0;
        const maxHits = 9; 
        let isDead = false;
        let lastHitTime = 0;

        // --- Camera Failure Vars ---
        let frameDropChance = 0; // Increases as screen breaks

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6 });

        faceMesh.onResults((results) => {
            // Simulate frame dropping/lag for "damaged" camera realism
            if (Math.random() < frameDropChance) return; 

            if (results.multiFaceLandmarks && results.multiFaceLandmarks[0] && !isDead) {
                const nose = results.multiFaceLandmarks[0][1];
                const now = Date.now();
                
                if (nose.z < -0.1 && (now - lastHitTime > 1200)) { 
                    lastHitTime = now;
                    hitCount++;
                    triggerDamage(nose.x * canvas.width, nose.y * canvas.height);
                }
            }
        });

        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
            video.srcObject = stream;
            const predict = async () => {
                await faceMesh.send({ image: video });
                requestAnimationFrame(predict);
            };
            predict();
        });

        function triggerDamage(x, y) {
            // Hardware feedback
            video.classList.add('impact-shake');
            setTimeout(() => video.classList.remove('impact-shake'), 300);
            
            // Audio with variable pitch
            const audio = new Audio('https://www.soundjay.com/misc/sounds/glass-break-1.mp3');
            audio.playbackRate = 0.6 + (Math.random() * 0.6);
            audio.play().catch(() => {});

            // Update realism parameters
            frameDropChance = hitCount * 0.08; 
            overlay.style.opacity = (0.1 + (hitCount * 0.1)).toString();
            ui.innerText = `CRITICAL FAILURE: HIT ${hitCount}/${maxHits}`;

            // Draw Cracks
            renderCracks(x, y, true);  // Structural
            renderCracks(x, y, false); // Micro-splinters
            renderDeadPixels(x, y);
            renderLCDStripes(x);

            if (hitCount >= maxHits) {
                killScreen();
            }
        }

        function renderCracks(x, y, isDeep) {
            const count = isDeep ? 10 : 25;
            ctx.lineJoin = "round";
            ctx.lineCap = "round";

            for (let i = 0; i < count; i++) {
                let cx = x, cy = y;
                let angle = isDeep ? (i / count) * Math.PI * 2 + Math.random() : Math.random() * Math.PI * 2;
                let segments = isDeep ? 6 : 2;

                let points = [{x, y}];
                for (let j = 0; j < segments; j++) {
                    let len = isDeep ? (Math.random() * 100 + 50) : (Math.random() * 20);
                    cx += Math.cos(angle) * len;
                    cy += Math.sin(angle) * len;
                    angle += (Math.random() - 0.5) * 1.5;
                    points.push({x: cx, y: cy});
                }

                // Shadow for 3D look
                ctx.strokeStyle = "rgba(0,0,0,0.5)";
                ctx.lineWidth = isDeep ? 3 : 1;
                ctx.beginPath();
                ctx.moveTo(points[0].x + 1.5, points[0].y + 1.5);
                points.forEach(p => ctx.lineTo(p.x + 1.5, p.y + 1.5));
                ctx.stroke();

                // Highlight for glass edge
                ctx.strokeStyle = isDeep ? "rgba(255,255,255,0.9)" : "rgba(200,220,255,0.6)";
                ctx.lineWidth = isDeep ? 0.8 : 0.4;
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                points.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.stroke();
            }
        }

        function renderDeadPixels(x, y) {
            const size = 15 + (hitCount * 8);
            const grad = ctx.createRadialGradient(x, y, 0, x, y, size);
            grad.addColorStop(0, "black");
            grad.addColorStop(0.7, "rgba(0,0,0,0.9)");
            grad.addColorStop(1, "transparent");
            
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();
        }

        function renderLCDStripes(x) {
            const colors = ['#0ff', '#f0f', '#fff', '#000'];
            ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
            ctx.globalAlpha = 0.4;
            ctx.fillRect(x + (Math.random() - 0.5) * 80, 0, Math.random() * 4, canvas.height);
            ctx.globalAlpha = 1;
        }

        function killScreen() {
            isDead = true;
            video.style.opacity = "0";
            ui.style.display = "none";
            overlay.style.opacity = "0.7";
            
            // Fill background with black behind existing cracks
            ctx.globalCompositeOperation = 'destination-over';
            ctx.fillStyle = "#050505";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            setTimeout(() => { message.style.opacity = "1"; }, 1200);
        }
    </script>
</body>
</html>
