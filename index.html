<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shatter to Particle Morph</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #video { position: absolute; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; transform: scaleX(-1); }
        #crackCanvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        #threeContainer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 20; display: none; }
        
        #ui {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: #0f0; background: rgba(0,0,0,0.9); padding: 12px 24px;
            z-index: 101; border: 1px solid #0f0; text-transform: uppercase; letter-spacing: 2px;
        }

        .impact-flash { animation: flash 0.3s ease-out; }
        @keyframes flash { 0% { filter: brightness(5) contrast(2); } 100% { filter: brightness(1) contrast(1); } }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <canvas id="crackCanvas"></canvas>
    <div id="threeContainer"></div>
    <div id="ui">AWAITING IMPACT...</div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">
        const video = document.getElementById('video');
        const canvas = document.getElementById('crackCanvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('ui');
        const threeContainer = document.getElementById('threeContainer');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let hitCount = 0;
        const maxHits = 5;
        let isMorphed = false;
        let particles, scene, camera, renderer;
        let mouseX = 0, mouseY = 0;

        // 1. MediaPipe Setup
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6 });

        faceMesh.onResults((results) => {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks[0]) {
                const nose = results.multiFaceLandmarks[0][1];
                const indexFinger = results.multiFaceLandmarks[0][468]; // Use eye/nose for movement after morph

                if (!isMorphed) {
                    if (nose.z < -0.11) { 
                        hitCount++;
                        triggerShatter(nose.x * canvas.width, nose.y * canvas.height);
                    }
                } else {
                    // Control particles with head/nose movement
                    mouseX = (nose.x - 0.5) * 20;
                    mouseY = (nose.y - 0.5) * -20;
                }
            }
        });

        // 2. Camera Start
        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
            video.srcObject = stream;
            const predict = async () => {
                await faceMesh.send({ image: video });
                requestAnimationFrame(predict);
            };
            predict();
        });

        // 3. Crack Logic
        function triggerShatter(x, y) {
            video.classList.add('impact-flash');
            setTimeout(() => video.classList.remove('impact-flash'), 300);

            // Draw basic 2D cracks
            ctx.strokeStyle = "rgba(255,255,255,0.8)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, y);
            for(let i=0; i<10; i++) {
                let angle = Math.random() * Math.PI * 2;
                ctx.lineTo(x + Math.cos(angle) * 100, y + Math.sin(angle) * 100);
                ctx.moveTo(x, y);
            }
            ctx.stroke();

            if (hitCount >= maxHits) {
                morphTo3D();
            }
        }

        // 4. Three.js Particle System
        function morphTo3D() {
            isMorphed = true;
            ui.innerText = "SYSTEM MORPHED. CONTROL WITH HEAD GESTURES.";
            video.style.display = 'none';
            canvas.style.display = 'none';
            threeContainer.style.display = 'block';

            // Setup Scene
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            threeContainer.appendChild(renderer.domElement);

            // Create Particles
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for (let i = 0; i < 15000; i++) {
                vertices.push(THREE.MathUtils.randFloatSpread(200)); // x
                vertices.push(THREE.MathUtils.randFloatSpread(200)); // y
                vertices.push(THREE.MathUtils.randFloatSpread(200)); // z
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            
            const material = new THREE.PointsMaterial({ 
                color: 0xff0055, 
                size: 0.5, 
                transparent: true, 
                blending: THREE.AdditiveBlending 
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
            camera.position.z = 100;

            animate3D();
        }

        function animate3D() {
            requestAnimationFrame(animate3D);

            // Morphing animation
            particles.rotation.x += 0.001;
            particles.rotation.y += 0.002;

            // Interactive movement based on MediaPipe tracking
            particles.position.x += (mouseX - particles.position.x) * 0.05;
            particles.position.y += (mouseY - particles.position.y) * 0.05;

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
