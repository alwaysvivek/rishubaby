<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Cosmic Memory ✨</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #gate { position: fixed; inset: 0; background: #000; z-index: 200; display: flex; justify-content: center; align-items: center; }
        .btn { background: #fff; padding: 15px 30px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 0 20px rgba(255,0,119,0.4); }
        
        #ui { position: absolute; top: 20px; left: 20px; color: white; z-index: 10; pointer-events: none; }
        #status { font-weight: bold; font-size: 1.4rem; color: #ff0077; margin-bottom: 5px; text-transform: uppercase; text-shadow: 0 0 10px rgba(255,0,119,0.5); }
        #detection-alert { font-size: 11px; color: #00ffcc; opacity: 0.8; margin-bottom: 10px; }
        .guide { font-size: 13px; opacity: 0.8; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 12px; border: 1px solid #333; line-height: 1.6; backdrop-filter: blur(5px); }
        
        #video-container { position: absolute; bottom: 20px; right: 20px; width: 180px; height: 135px; border: 2px solid #ff0077; border-radius: 10px; overflow: hidden; transform: scaleX(-1); opacity: 0.3; transition: opacity 0.3s; }
        #video-container:hover { opacity: 0.8; }
        video { width: 100%; height: 100%; object-fit: cover; }

        #hint {
            position: fixed; bottom: 10%; left: 50%; transform: translateX(-50%);
            color: white; text-align: center; z-index: 5; letter-spacing: 2px; text-transform: uppercase; font-size: 12px;
            animation: breathe 2s infinite ease-in-out;
        }
        @keyframes breathe { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="gate">
        <button class="btn" onclick="initExperience()">Open My Gift 🎁</button>
    </div>

    <div id="ui">
        <div id="status">LOCKED</div>
        <div id="detection-alert">Waiting for Hands...</div>
        <div class="guide" id="guide-box" style="display: none;">
            ✊ <b>Fist:</b> VACUUM MODE<br>
            ✌️ <b>Peace:</b> STAR DRIFT<br>
            👐 <b>Two Hands:</b> ZOOM DISTANCE
        </div>
    </div>

    <div id="hint">Grab with BOTH hands and pull apart to break the cosmic egg!</div>

    <div id="video-container"><video id="input_video"></video></div>
    <audio id="song" src="1.mp3" loop></audio>

    <script>
        let scene, camera, renderer, particleSystem, stars;
        let isRevealed = false, isGrabbing = false, isPeace = false, crackProgress = 0;
        let targetZoom = 50, lastHandDist = 0;
        let handPos = new THREE.Vector3(0, 0, 0);
        const PARTICLE_COUNT = 9000;

        // HORIZONTAL EGG SHAPE
        const shapes = {
            eggLeftRight: (i) => {
                const t = Math.random() * Math.PI * 2;
                const u = Math.random() * Math.PI;
                const r = 10;
                // STRETCHED HORIZONTALLY (X-axis) - 2.0 multiplier for width
                const x = r * Math.sin(u) * Math.cos(t) * 2.0; 
                const y = r * Math.sin(u) * Math.sin(t) * 1.0;
                const z = r * Math.cos(u) * 1.0;
                return new THREE.Vector3(x, y, z);
            },
            photo: (i) => {
                const x = (i % 100) - 50;
                const y = 45 - Math.floor(i / 100);
                return new THREE.Vector3(x * 0.45, y * 0.45, 0);
            }
        };

        function initExperience() {
            document.getElementById('gate').style.display = 'none';
            document.getElementById('song').play().catch(e => console.log("Audio play blocked"));
            
            const img = new Image();
            img.src = 'a.png';
            img.crossOrigin = "Anonymous";
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 100; canvas.height = 90;
                ctx.drawImage(img, 0, 0, 100, 90);
                setupThree(ctx.getImageData(0, 0, 100, 90).data);
                initTracking();
            };
        }

        function setupThree(imgData) {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
            camera.position.z = 100; // Start further back

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Stars Background
            const starGeo = new THREE.BufferGeometry();
            const starPos = new Float32Array(3000 * 3);
            for(let i=0; i<9000; i++) starPos[i] = (Math.random()-0.5) * 1500;
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, transparent: true, opacity: 0.5 }));
            scene.add(stars);

            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            const targets = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);

            for(let i=0; i<PARTICLE_COUNT; i++) {
                const p = shapes.eggLeftRight(i);
                pos[i*3] = p.x; pos[i*3+1] = p.y; pos[i*3+2] = p.z;
                targets[i*3] = p.x; targets[i*3+1] = p.y; targets[i*3+2] = p.z;
                colors[i*3] = 1; colors[i*3+1] = 1; colors[i*3+2] = 1; 
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('target', new THREE.BufferAttribute(targets, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            particleSystem = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.25, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending }));
            scene.add(particleSystem);
            particleSystem.userData.imgColors = imgData;
            animate();
        }

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function initTracking() {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({maxNumHands: 2, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7});

            hands.onResults(results => {
                const status = document.getElementById('status');
                const alert = document.getElementById('detection-alert');
                
                if (results.multiHandLandmarks?.length > 0) {
                    alert.innerText = results.multiHandLandmarks.length === 2 ? "BOTH HANDS ACTIVE" : "ONE HAND ACTIVE";
                    
                    const h1 = results.multiHandLandmarks[0];
                    
                    // GESTURE CALCULATION
                    // Grab: Distance between index tip (8) and thumb tip (4) is small
                    const dist8_4 = getDistance(h1[8], h1[4]);
                    const isCurrentlyGrabbing = dist8_4 < 0.05; 
                    
                    // Peace: Index (8) and Middle (12) extended, others closed
                    const isCurrentlyPeace = h1[8].y < h1[6].y && h1[12].y < h1[10].y && h1[16].y > h1[14].y;

                    if (results.multiHandLandmarks.length === 2) {
                        const h2 = results.multiHandLandmarks[1];
                        const currentDist = Math.abs(h1[0].x - h2[0].x);

                        if (!isRevealed) {
                            // Check for "Tearing" - both hands grabbing and moving apart
                            const dist8_4_h2 = getDistance(h2[8], h2[4]);
                            if (isCurrentlyGrabbing && dist8_4_h2 < 0.05) {
                                if (lastHandDist > 0) {
                                    let pull = Math.max(0, currentDist - lastHandDist);
                                    crackProgress += pull * 12; // Adjusted sensitivity
                                    status.innerText = "TEARING SPACE-TIME...";
                                }
                            }
                        } else {
                            // Dynamic Zoom when revealed
                            targetZoom = THREE.MathUtils.mapLinear(currentDist, 0.2, 0.7, 70, 15);
                        }
                        lastHandDist = currentDist;
                    }

                    if (isRevealed) {
                        isGrabbing = isCurrentlyGrabbing;
                        isPeace = isCurrentlyPeace;
                        // Smoothly move hand position
                        const tx = (h1[9].x - 0.5) * -60;
                        const ty = (h1[9].y - 0.5) * -45;
                        handPos.lerp(new THREE.Vector3(tx, ty, 0), 0.2);
                        
                        if(isGrabbing) status.innerText = "GRAVITY WELL";
                        else if(isPeace) status.innerText = "STAR DRIFT";
                        else status.innerText = "HAPPY ANNIVERSARY ✨";
                    }

                    if (crackProgress > 1.5 && !isRevealed) reveal();
                } else {
                    alert.innerText = "BRING HANDS INTO VIEW";
                    lastHandDist = 0;
                }
            });

            const cameraPipe = new Camera(document.getElementById('input_video'), {
                onFrame: async () => { await hands.send({image: document.getElementById('input_video')}); },
                width: 640, height: 480
            });
            cameraPipe.start();
        }

        function reveal() {
            isRevealed = true;
            document.getElementById('hint').style.display = 'none';
            document.getElementById('guide-box').style.display = 'block';
            
            const colorAttr = particleSystem.geometry.attributes.color;
            const imgData = particleSystem.userData.imgColors;
            for(let i=0; i<PARTICLE_COUNT; i++) {
                colorAttr.array[i*3] = imgData[i*4]/255;
                colorAttr.array[i*3+1] = imgData[i*4+1]/255;
                colorAttr.array[i*3+2] = imgData[i*4+2]/255;
            }
            colorAttr.needsUpdate = true;

            const tAttr = particleSystem.geometry.attributes.target;
            for(let i=0; i<PARTICLE_COUNT; i++) {
                const p = shapes.photo(i);
                tAttr.array[i*3] = p.x; tAttr.array[i*3+1] = p.y; tAttr.array[i*3+2] = p.z;
            }
            tAttr.needsUpdate = true;
        }

        function animate() {
            requestAnimationFrame(animate);
            const pos = particleSystem.geometry.attributes.position;
            const target = particleSystem.geometry.attributes.target;
            const time = Date.now() * 0.002;

            for(let i=0; i<PARTICLE_COUNT; i++) {
                const ix = i*3, iy = i*3+1, iz = i*3+2;
                
                if (isGrabbing && isRevealed) {
                    // Pull particles toward hand with a swirl
                    let dx = handPos.x - pos.array[ix];
                    let dy = handPos.y - pos.array[iy];
                    pos.array[ix] += dx * 0.15 + dy * 0.05;
                    pos.array[iy] += dy * 0.15 - dx * 0.05;
                    pos.array[iz] += (0 - pos.array[iz]) * 0.1;
                } else {
                    // Return to target shape with a bit of "float"
                    const speed = isRevealed ? 0.07 : 0.04;
                    const floatX = Math.sin(time + i) * 0.02;
                    const floatY = Math.cos(time + i) * 0.02;

                    pos.array[ix] += (target.array[ix] - pos.array[ix]) * speed + floatX;
                    pos.array[iy] += (target.array[iy] - pos.array[iy]) * speed + floatY;
                    pos.array[iz] += (target.array[iz] - pos.array[iz]) * speed;

                    // Egg jitter when tearing
                    if (!isRevealed && crackProgress > 0) {
                        pos.array[ix] += (Math.random()-0.5) * crackProgress * 0.5;
                        pos.array[iy] += (Math.random()-0.5) * crackProgress * 0.5;
                    }
                }
            }
            
            pos.needsUpdate = true;
            
            // Star Mode logic
            if (isPeace && isRevealed) {
                stars.rotation.y += 0.02;
                stars.position.z = Math.sin(time) * 50;
            } else {
                stars.rotation.y += 0.0005;
                stars.position.z += (0 - stars.position.z) * 0.05;
            }

            camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetZoom, 0.08);
            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
