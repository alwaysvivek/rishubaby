<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Screen Destruction</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        
        #video { 
            position: absolute; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: 1; transform: scaleX(-1);
            transition: opacity 0.5s ease, filter 0.3s ease;
        }

        #crackCanvas { 
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100vh; z-index: 10; pointer-events: none; 
        }
        
        #message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 5rem; font-weight: 900; opacity: 0;
            z-index: 100; text-shadow: 0 0 20px #ff0055;
            letter-spacing: 15px; text-transform: uppercase;
            pointer-events: none;
        }

        #ui {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: #0f0; background: rgba(0,0,0,0.9); padding: 10px 20px;
            border-radius: 5px; z-index: 101; border: 1px solid #0f0;
            text-transform: uppercase; font-size: 0.8rem;
        }

        /* Screen Death Animation */
        .total-failure {
            filter: brightness(0) !important;
            opacity: 0 !important;
        }

        .glitch-heavy {
            animation: heavyShake 0.1s infinite;
            filter: hue-rotate(90deg) contrast(2) brightness(1.5);
        }

        @keyframes heavyShake {
            0% { transform: translate(0,0) scaleX(-1); }
            50% { transform: translate(-10px, 5px) scaleX(-1.05); }
            100% { transform: translate(10px, -5px) scaleX(-0.95); }
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <canvas id="crackCanvas"></canvas>
    <div id="ui">SYSTEM READY. PROXIMITY SENSOR ACTIVE...</div>
    <div id="message">i love u</div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script type="module">
        const video = document.getElementById('video');
        const canvas = document.getElementById('crackCanvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('ui');
        const message = document.getElementById('message');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let lastShatterTime = 0;
        const shatterCooldown = 1000;
        let hitCount = 0;
        const maxHits = 6; 

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });

        faceMesh.onResults((results) => {
            const currentTime = Date.now();
            if (results.multiFaceLandmarks && results.multiFaceLandmarks[0] && hitCount < maxHits) {
                const nose = results.multiFaceLandmarks[0][1];
                
                // Visual feedback as you get closer to destruction
                if (hitCount > 3) video.style.filter = `contrast(${100 + hitCount*20}%) brightness(${1 - (hitCount*0.1)})`;

                if (nose.z < -0.1 && (currentTime - lastShatterTime > shatterCooldown)) { 
                    lastShatterTime = currentTime;
                    hitCount++;
                    triggerShatter(nose.x * canvas.width, nose.y * canvas.height);
                }
            }
        });

        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
            video.srcObject = stream;
            const predict = async () => {
                await faceMesh.send({ image: video });
                requestAnimationFrame(predict);
            };
            predict();
        });

        function triggerShatter(x, y) {
            // Sound effect
            const audio = new Audio('https://www.soundjay.com/misc/sounds/glass-break-1.mp3');
            audio.play().catch(() => {});

            // Heavy glitch on impact
            video.classList.add('glitch-heavy');
            setTimeout(() => video.classList.remove('glitch-heavy'), 200);

            // If it's the final hit, kill the video feed entirely
            if (hitCount >= maxHits) {
                video.classList.add('total-failure');
                ui.style.display = 'none';
                renderFinalDestruction();
                setTimeout(() => { message.style.opacity = "1"; }, 1000);
            }

            drawCircularCrack(x, y, 40 + Math.random() * 20);
            drawFractureLines(x, y);
            drawLCDBleed(x);
        }

        function drawCircularCrack(centerX, centerY, radius) {
            ctx.strokeStyle = "rgba(255,255,255,0.9)";
            ctx.lineWidth = 0.5;
            for(let r = radius * 0.2; r < radius; r += 8) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function drawFractureLines(x, y) {
            ctx.strokeStyle = "rgba(220,220,255,0.8)";
            for (let i = 0; i < 12; i++) {
                let currX = x, currY = y;
                let angle = Math.random() * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(x, y);
                for (let j = 0; j < 8; j++) {
                    currX += Math.cos(angle) * 60;
                    currY += Math.sin(angle) * 60;
                    angle += (Math.random() - 0.5);
                    ctx.lineTo(currX, currY);
                }
                ctx.stroke();
            }
        }

        function drawLCDBleed(x) {
            const colors = ['#ff00ff', '#00ffff', '#ffffff', '#222'];
            ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
            ctx.globalAlpha = 0.6;
            ctx.fillRect(x + (Math.random()-0.5)*50, 0, Math.random()*5, canvas.height);
        }

        function renderFinalDestruction() {
            // Fill background with black but keep cracks visible
            ctx.globalCompositeOperation = 'destination-over';
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Add extra massive "dead" zones for realism
            ctx.globalCompositeOperation = 'source-over';
            for(let i=0; i<10; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? "black" : "#111";
                ctx.beginPath();
                ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*200, 0, Math.PI*2);
                ctx.fill();
            }
        }
    </script>
</body>
</html>
