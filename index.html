<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Cosmic Memory ✨</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #gate { position: fixed; inset: 0; background: #000; z-index: 200; display: flex; justify-content: center; align-items: center; }
        .btn { background: #fff; padding: 15px 30px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 0 20px rgba(255,0,119,0.4); }
        
        #ui { position: absolute; top: 20px; left: 20px; color: white; z-index: 10; pointer-events: none; }
        #status { font-weight: bold; font-size: 1.4rem; color: #ff0077; margin-bottom: 5px; text-transform: uppercase; }
        #detection-alert { font-size: 11px; color: #00ffcc; opacity: 0.8; margin-bottom: 10px; }
        .guide { font-size: 13px; opacity: 0.8; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 12px; border: 1px solid #333; line-height: 1.6; backdrop-filter: blur(5px); }
        
        #video-container { position: absolute; bottom: 20px; right: 20px; width: 180px; height: 135px; border: 2px solid #ff0077; border-radius: 10px; overflow: hidden; transform: scaleX(-1); opacity: 0.5; }
        video { width: 100%; height: 100%; object-fit: cover; }

        #hint {
            position: fixed; bottom: 10%; left: 50%; transform: translateX(-50%);
            color: white; text-align: center; z-index: 5; letter-spacing: 2px; text-transform: uppercase; font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="gate">
        <button class="btn" onclick="initExperience()">Open My Gift 🎁</button>
    </div>

    <div id="ui">
        <div id="status">LOCKED</div>
        <div id="detection-alert">Waiting for Hands...</div>
        <div class="guide" id="guide-box" style="display: none;">
            🤟 <b>ILY:</b> "I ❤️ U"<br>
            ✊ <b>Fist:</b> MEGA VACUUM<br>
            ✌️ <b>Peace:</b> STAR MODE<br>
            👐 <b>Pull Apart:</b> ZOOM
        </div>
    </div>

    <div id="hint">Grab with BOTH hands and pull apart to break!</div>

    <div id="video-container"><video id="input_video"></video></div>
    <audio id="song" src="1.mp3" loop></audio>

    <script>
        let scene, camera, renderer, particleSystem, stars;
        let isRevealed = false, isGrabbing = false, crackProgress = 0;
        let targetZoom = 35, lastHandDist = 0;
        let handPos = new THREE.Vector3(0, 0, 0);
        const PARTICLE_COUNT = 9000;

        const shapes = {
            eggLeftRight: (i) => {
                const t = Math.random() * Math.PI * 2;
                const u = Math.random() * Math.PI;
                const r = 10;
                // STRETCHED HORIZONTALLY (X-axis)
                const x = r * Math.sin(u) * Math.cos(t) * 1.8; 
                const y = r * Math.sin(u) * Math.sin(t) * 0.9;
                const z = r * Math.cos(u) * 0.9;
                return new THREE.Vector3(x, y, z);
            },
            photo: (i) => {
                const x = (i % 100) - 50;
                const y = 45 - Math.floor(i / 100);
                return new THREE.Vector3(x * 0.45, y * 0.45, 0);
            }
        };

        function initExperience() {
            document.getElementById('gate').style.display = 'none';
            document.getElementById('song').play();
            const img = new Image();
            img.src = 'a.png';
            img.crossOrigin = "Anonymous";
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 100; canvas.height = 90;
                ctx.drawImage(img, 0, 0, 100, 90);
                setupThree(ctx.getImageData(0, 0, 100, 90).data);
                initTracking();
            };
        }

        function setupThree(imgData) {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
            camera.position.z = 50;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const starGeo = new THREE.BufferGeometry();
            const starPos = new Float32Array(2000 * 3);
            for(let i=0; i<6000; i++) starPos[i] = (Math.random()-0.5) * 1000;
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.5 }));
            scene.add(stars);

            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            const targets = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);

            for(let i=0; i<PARTICLE_COUNT; i++) {
                const p = shapes.eggLeftRight(i);
                pos[i*3] = p.x; pos[i*3+1] = p.y; pos[i*3+2] = p.z;
                targets[i*3] = p.x; targets[i*3+1] = p.y; targets[i*3+2] = p.z;
                colors[i*3] = 1; colors[i*3+1] = 1; colors[i*3+2] = 1; 
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('target', new THREE.BufferAttribute(targets, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            particleSystem = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.2, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending }));
            scene.add(particleSystem);
            particleSystem.userData.imgColors = imgData;
            animate();
        }

        function initTracking() {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({maxNumHands: 2, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6});

            hands.onResults(results => {
                const status = document.getElementById('status');
                const alert = document.getElementById('detection-alert');
                
                if (results.multiHandLandmarks?.length === 2) {
                    alert.innerText = "BOTH HANDS DETECTED ✓";
                    const h1 = results.multiHandLandmarks[0];
                    const h2 = results.multiHandLandmarks[1];

                    // SIMPLE GRAB: Check if fingertips are below middle joints
                    const isGrab1 = h1[8].y > h1[6].y;
                    const isGrab2 = h2[8].y > h2[6].y;

                    if (!isRevealed && isGrab1 && isGrab2) {
                        const currentDist = Math.abs(h1[0].x - h2[0].x);
                        if (lastHandDist > 0) {
                            let pull = Math.max(0, currentDist - lastHandDist);
                            crackProgress += pull * 15;
                        }
                        lastHandDist = currentDist;
                        status.innerText = "TEARING...";
                    } else if (isRevealed) {
                        // Original zoom logic
                        targetZoom = THREE.MathUtils.mapLinear(Math.abs(h1[0].x - h2[0].x), 0.1, 0.8, 60, 5);
                    }
                    if (crackProgress > 1.2 && !isRevealed) reveal();
                } else {
                    alert.innerText = "BRING BOTH HANDS INTO VIEW";
                    lastHandDist = 0;
                }

                if (results.multiHandLandmarks?.length > 0 && isRevealed) {
                    const h = results.multiHandLandmarks[0];
                    handPos.set((h[9].x - 0.5) * -55, (h[9].y - 0.5) * -45, h[9].z * 35);
                    isGrabbing = h[8].y > h[6].y && h[12].y > h[10].y;
                }
            });

            const cameraPipe = new Camera(document.getElementById('input_video'), {
                onFrame: async () => { await hands.send({image: document.getElementById('input_video')}); },
                width: 640, height: 480
            });
            cameraPipe.start();
        }

        function reveal() {
            isRevealed = true;
            document.getElementById('hint').style.display = 'none';
            document.getElementById('guide-box').style.display = 'block';
            document.getElementById('status').innerText = "HAPPY ANNIVERSARY ✨";
            const colorAttr = particleSystem.geometry.attributes.color;
            const imgData = particleSystem.userData.imgColors;
            for(let i=0; i<PARTICLE_COUNT; i++) {
                colorAttr.array[i*3] = imgData[i*4]/255;
                colorAttr.array[i*3+1] = imgData[i*4+1]/255;
                colorAttr.array[i*3+2] = imgData[i*4+2]/255;
            }
            colorAttr.needsUpdate = true;
            const tAttr = particleSystem.geometry.attributes.target;
            for(let i=0; i<PARTICLE_COUNT; i++) {
                const p = shapes.photo(i);
                tAttr.array[i*3] = p.x; tAttr.array[i*3+1] = p.y; tAttr.array[i*3+2] = p.z;
            }
            tAttr.needsUpdate = true;
        }

        function animate() {
            requestAnimationFrame(animate);
            const pos = particleSystem.geometry.attributes.position;
            const target = particleSystem.geometry.attributes.target;
            const time = Date.now() * 0.002;
            let pulse = (isRevealed && !isGrabbing) ? (1.0 + Math.sin(time * 1.5) * 0.05) : 1.0;

            for(let i=0; i<PARTICLE_COUNT; i++) {
                const ix = i*3, iy = i*3+1, iz = i*3+2;
                if (isGrabbing && isRevealed) {
                    let dx = handPos.x - pos.array[ix], dy = handPos.y - pos.array[iy];
                    pos.array[ix] += dx * 0.35 + dy * 0.1;
                    pos.array[iy] += dy * 0.35 - dx * 0.1;
                } else {
                    const s = isRevealed ? 0.08 : 0.05;
                    pos.array[ix] += (target.array[ix] * pulse - pos.array[ix]) * s;
                    pos.array[iy] += (target.array[iy] * pulse - pos.array[iy]) * s;
                    pos.array[iz] += (target.array[iz] * pulse - pos.array[iz]) * s;
                    if (!isRevealed && crackProgress > 0) pos.array[ix] += (Math.random()-0.5) * crackProgress * 2;
                }
            }
            pos.needsUpdate = true;
            stars.rotation.y += 0.0005;
            camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetZoom, 0.05);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
