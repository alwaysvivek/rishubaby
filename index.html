<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity & Particle Text Pro - Persistent Explosion</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; z-index: 10; pointer-events: none; }
        #status { font-weight: bold; font-size: 1.4rem; color: #ff0077; margin-bottom: 10px; text-transform: uppercase; }
        .guide { font-size: 13px; opacity: 0.8; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 12px; border: 1px solid #333; }
        #video-container { position: absolute; bottom: 20px; right: 20px; width: 180px; height: 135px; border: 2px solid #ff0077; border-radius: 10px; overflow: hidden; transform: scaleX(-1); opacity: 0.6; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="status">Ready...</div>
        <div class="guide">
            👏 <b>Clap:</b> Explode (Stays exploded!)<br>
            🤟 <b>ILY Gesture:</b> Re-form "I ❤️ U"<br>
            ✌️ <b>Peace:</b> Re-form Star Shape<br>
            ✊ <b>Fist:</b> Vacuum / Grab Particles<br>
            👐 <b>Two Hands:</b> Zoom In/Out
        </div>
    </div>

    <div id="video-container"><video id="input_video"></video></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        let scene, camera, renderer, particleSystem;
        const PARTICLE_COUNT = 9000;
        let handPos = new THREE.Vector3(0, 0, 0);
        let isGrabbing = false;
        let isExploded = false;
        let targetZoom = 25;
        let lastHandDist = 0;

        // Shape definitions
        const shapes = {
            heartText: (i) => {
                const section = i % 3;
                if (section === 0) { return new THREE.Vector3(-12, (Math.random() * 10) - 5, (Math.random()-0.5)); } 
                else if (section === 1) { 
                    const t = Math.random() * Math.PI * 2;
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    return new THREE.Vector3(x * 0.45, y * 0.45, (Math.random()-0.5) * 2);
                } else { 
                    const t = (Math.random() * Math.PI) + Math.PI;
                    const x = Math.cos(t) * 5 + 12;
                    const y = Math.sin(t) * 7 + 2;
                    return (Math.random() > 0.5) ? new THREE.Vector3(x, y + (Math.random() * 5), 0) : new THREE.Vector3(x, y, 0);
                }
            },
            star: (i) => {
                const arms = 5;
                const angle = (i % arms) * (Math.PI * 2 / arms);
                const r = Math.random() * 15;
                return new THREE.Vector3(Math.cos(angle) * r, Math.sin(angle) * r, (Math.random()-0.5)*5);
            },
            explode: () => new THREE.Vector3(
                (Math.random() - 0.5) * 150, 
                (Math.random() - 0.5) * 150, 
                (Math.random() - 0.5) * 150
            )
        };

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
            camera.position.z = 25;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            const targets = new Float32Array(PARTICLE_COUNT * 3);

            for(let i=0; i<PARTICLE_COUNT; i++) {
                const p = shapes.heartText(i);
                pos[i*3] = p.x; pos[i*3+1] = p.y; pos[i*3+2] = p.z;
                targets[i*3] = p.x; targets[i*3+1] = p.y; targets[i*3+2] = p.z;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('target', new THREE.BufferAttribute(targets, 3));
            
            const mat = new THREE.PointsMaterial({ color: 0xff0077, size: 0.12, transparent: true, blending: THREE.AdditiveBlending });
            particleSystem = new THREE.Points(geo, mat);
            scene.add(particleSystem);
        }

        function updateTargetShape(shapeName) {
            isExploded = (shapeName === 'explode');
            const targetAttr = particleSystem.geometry.attributes.target;
            for(let i=0; i<PARTICLE_COUNT; i++) {
                const p = shapes[shapeName](i);
                targetAttr.array[i*3] = p.x;
                targetAttr.array[i*3+1] = p.y;
                targetAttr.array[i*3+2] = p.z;
            }
            targetAttr.needsUpdate = true;
        }

        function initTracking() {
            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

            hands.onResults(results => {
                const status = document.getElementById('status');
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const hand1 = results.multiHandLandmarks[0];
                    
                    // Two Hand Logic
                    if (results.multiHandLandmarks.length === 2) {
                        const hand2 = results.multiHandLandmarks[1];
                        const dist = Math.hypot(hand1[9].x - hand2[9].x, hand1[9].y - hand2[9].y);
                        
                        // Zoom
                        targetZoom = THREE.MathUtils.mapLinear(dist, 0.1, 0.7, 60, 5);
                        
                        // Clap Detection
                        if (lastHandDist - dist > 0.12) {
                            status.innerText = "💥 SHATTERED";
                            updateTargetShape('explode');
                            // Automatic return timer removed!
                        }
                        lastHandDist = dist;
                    }

                    // Hand Mapping
                    handPos.set((hand1[9].x - 0.5) * -50, (hand1[9].y - 0.5) * -40, (hand1[9].z * 30));

                    const isIndexUp = hand1[8].y < hand1[6].y;
                    const isMiddleUp = hand1[12].y < hand1[10].y;
                    const isPinkyUp = hand1[20].y < hand1[18].y;
                    const isFist = [8, 12, 16, 20].every(i => hand1[i].y > hand1[i-2].y);

                    if (isFist) {
                        isGrabbing = true;
                        status.innerText = "✊ VACUUM MODE";
                        particleSystem.material.color.set(0x00ffcc);
                    } else {
                        isGrabbing = false;
                        particleSystem.material.color.set(0xff0077);
                        if (isIndexUp && isPinkyUp && !isMiddleUp) {
                            status.innerText = "🤟 I ❤️ U";
                            updateTargetShape('heartText');
                        } else if (isIndexUp && isMiddleUp && !isPinkyUp) {
                            status.innerText = "✌️ STAR MODE";
                            updateTargetShape('star');
                        }
                    }
                }
            });

            const cameraPipe = new Camera(document.getElementById('input_video'), {
                onFrame: async () => { await hands.send({image: document.getElementById('input_video')}); },
                width: 640, height: 480
            });
            cameraPipe.start();
        }

        function animate() {
            requestAnimationFrame(animate);
            const posAttr = particleSystem.geometry.attributes.position;
            const targetAttr = particleSystem.geometry.attributes.target;
            
            // Speed stays slightly faster during explosion for a "drift" feel
            const speed = isExploded ? 0.04 : 0.08;

            for(let i=0; i<PARTICLE_COUNT; i++) {
                const ix = i*3, iy = i*3+1, iz = i*3+2;
                if (isGrabbing) {
                    // Pull to hand
                    posAttr.array[ix] += (handPos.x - posAttr.array[ix]) * 0.12;
                    posAttr.array[iy] += (handPos.y - posAttr.array[iy]) * 0.12;
                    posAttr.array[iz] += (handPos.z - posAttr.array[iz]) * 0.12;
                } else {
                    // Move toward target (either the text or the exploded coordinate)
                    posAttr.array[ix] += (targetAttr.array[ix] - posAttr.array[ix]) * speed;
                    posAttr.array[iy] += (targetAttr.array[iy] - posAttr.array[iy]) * speed;
                    posAttr.array[iz] += (targetAttr.array[iz] - posAttr.array[iz]) * speed;
                }
            }
            posAttr.needsUpdate = true;
            camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetZoom, 0.05);
            
            // Slow rotation for depth
            particleSystem.rotation.y += 0.002;
            renderer.render(scene, camera);
        }

        initThree();
        initTracking();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
