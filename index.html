<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Living Memory 💖</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #gate { position: fixed; inset: 0; background: #000; z-index: 200; display: flex; justify-content: center; align-items: center; }
        .btn { background: #fff; padding: 15px 30px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        
        #ui { position: absolute; top: 20px; left: 20px; color: white; z-index: 10; pointer-events: none; }
        #status { font-weight: bold; font-size: 1.4rem; color: #ff0077; margin-bottom: 10px; text-transform: uppercase; text-shadow: 0 0 10px rgba(255,0,119,0.5); }
        .guide { font-size: 13px; opacity: 0.8; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 12px; border: 1px solid #333; line-height: 1.6; backdrop-filter: blur(5px); }
        
        #video-container { position: absolute; bottom: 20px; right: 20px; width: 180px; height: 135px; border: 2px solid #ff0077; border-radius: 10px; overflow: hidden; transform: scaleX(-1); opacity: 0.6; }
        video { width: 100%; height: 100%; object-fit: cover; }

        #smile-prompt {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; text-align: center; z-index: 5; transition: opacity 0.5s;
        }
        .bar-bg { width: 220px; height: 3px; background: rgba(255,255,255,0.1); margin: 15px auto; border-radius: 10px; overflow: hidden; }
        #smile-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #ff0077, #ff69b4); transition: width 0.15s ease-out; }
    </style>
</head>
<body>

    <div id="gate">
        <button class="btn" onclick="initExperience()">Open Your Gift 🎁</button>
    </div>

    <div id="smile-prompt">
        <div style="letter-spacing: 4px; text-transform: uppercase; font-size: 13px; opacity: 0.9;">Give me a little smile to start...</div>
        <div class="bar-bg"><div id="smile-bar"></div></div>
    </div>

    <div id="ui">
        <div id="status">Waiting for you...</div>
        <div class="guide" id="guide-box" style="display: none;">
            👏 <b>Clap:</b> Shatter Memory<br>
            🤟 <b>ILY:</b> Form "I ❤️ U"<br>
            ✌️ <b>Peace:</b> Re-form Star<br>
            ✊ <b>Fist:</b> MEGA VACUUM<br>
            👐 <b>Two Hands:</b> Zoom In/Out
        </div>
    </div>

    <div id="video-container"><video id="input_video"></video></div>
    <audio id="song" src="1.mp3" loop></audio>

    <script>
        let scene, camera, renderer, particleSystem;
        let isRevealed = false, isExploded = false, isGrabbing = false;
        let targetZoom = 35, lastHandDist = 0;
        let handPos = new THREE.Vector3(0, 0, 0);
        const PARTICLE_COUNT = 9000;

        const shapes = {
            photo: (i) => {
                const x = (i % 100) - 50;
                const y = 50 - Math.floor(i / 100);
                return new THREE.Vector3(x * 0.45, y * 0.45, 0);
            },
            heartText: (i) => {
                const section = i % 3;
                if (section === 0) return new THREE.Vector3(-12, (Math.random() * 10) - 5, (Math.random()-0.5)); 
                if (section === 1) { 
                    const t = Math.random() * Math.PI * 2;
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    return new THREE.Vector3(x * 0.45, y * 0.45, (Math.random()-0.5) * 2);
                }
                const t = (Math.random() * Math.PI) + Math.PI;
                return new THREE.Vector3(Math.cos(t) * 5 + 12, Math.sin(t) * 7 + 2, 0);
            },
            star: (i) => {
                const arms = 5;
                const angle = (i % arms) * (Math.PI * 2 / arms);
                const r = Math.random() * 15;
                return new THREE.Vector3(Math.cos(angle) * r, Math.sin(angle) * r, (Math.random()-0.5)*5);
            },
            explode: () => new THREE.Vector3((Math.random()-0.5)*150, (Math.random()-0.5)*150, (Math.random()-0.5)*150)
        };

        function initExperience() {
            document.getElementById('gate').style.display = 'none';
            document.getElementById('song').play();
            
            const img = new Image();
            img.src = 'a.png';
            img.crossOrigin = "Anonymous";
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 100; canvas.height = 90;
                ctx.drawImage(img, 0, 0, 100, 90);
                const imgData = ctx.getImageData(0, 0, 100, 90).data;
                setupThree(imgData);
                initTracking();
            };
        }

        function setupThree(imgData) {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 100;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            const targets = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);

            for(let i=0; i<PARTICLE_COUNT; i++) {
                pos[i*3] = (Math.random()-0.5)*120;
                pos[i*3+1] = (Math.random()-0.5)*120;
                pos[i*3+2] = (Math.random()-0.5)*120;
                
                const p = shapes.photo(i);
                targets[i*3] = p.x; targets[i*3+1] = p.y; targets[i*3+2] = p.z;

                colors[i*3] = imgData[i*4]/255;
                colors[i*3+1] = imgData[i*4+1]/255;
                colors[i*3+2] = imgData[i*4+2]/255;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('target', new THREE.BufferAttribute(targets, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({ size: 0.18, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending });
            particleSystem = new THREE.Points(geo, mat);
            scene.add(particleSystem);
            animate();
        }

        function updateTargetShape(name) {
            isExploded = (name === 'explode');
            const tAttr = particleSystem.geometry.attributes.target;
            for(let i=0; i<PARTICLE_COUNT; i++) {
                const p = shapes[name](i);
                tAttr.array[i*3] = p.x; tAttr.array[i*3+1] = p.y; tAttr.array[i*3+2] = p.z;
            }
            tAttr.needsUpdate = true;
        }

        function initTracking() {
            const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
            faceMesh.setOptions({maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5});

            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({maxNumHands: 2, minDetectionConfidence: 0.6});

            faceMesh.onResults(results => {
                if (!isRevealed && results.multiFaceLandmarks?.[0]) {
                    const lm = results.multiFaceLandmarks[0];
                    const smileWidth = Math.hypot(lm[61].x - lm[291].x, lm[61].y - lm[291].y);
                    const faceWidth = Math.hypot(lm[234].x - lm[454].x, lm[234].y - lm[454].y);
                    
                    // EASIER SMILE: reduced from 0.45 to 0.38
                    let progress = Math.max(0, (smileWidth/faceWidth - 0.38) * 800);
                    document.getElementById('smile-bar').style.width = Math.min(progress, 100) + "%";
                    
                    if (progress > 10) document.getElementById('status').innerText = "Almost there... 😊";
                    
                    if (progress >= 100) {
                        isRevealed = true;
                        document.getElementById('smile-prompt').style.opacity = '0';
                        document.getElementById('guide-box').style.display = 'block';
                        document.getElementById('status').innerText = "Memory Unlocked ✨";
                        targetZoom = 25;
                    }
                }
            });

            hands.onResults(results => {
                const status = document.getElementById('status');
                if (results.multiHandLandmarks?.length > 0) {
                    const h1 = results.multiHandLandmarks[0];
                    handPos.set((h1[9].x - 0.5) * -55, (h1[9].y - 0.5) * -45, h1[9].z * 35);

                    if (results.multiHandLandmarks.length === 2) {
                        const h2 = results.multiHandLandmarks[1];
                        const dist = Math.hypot(h1[9].x - h2[9].x, h1[9].y - h2[9].y);
                        targetZoom = THREE.MathUtils.mapLinear(dist, 0.1, 0.7, 60, 5);
                        if (lastHandDist - dist > 0.15) { updateTargetShape('explode'); status.innerText = "💥 SHATTERED"; }
                        lastHandDist = dist;
                    }

                    const isFist = [8, 12, 16, 20].every(i => h1[i].y > h1[i-2].y);
                    const isPeace = h1[8].y < h1[6].y && h1[12].y < h1[10].y && h1[16].y > h1[14].y;
                    const isILY = h1[8].y < h1[6].y && h1[20].y < h1[18].y && h1[12].y > h1[10].y;

                    if (isFist) { isGrabbing = true; status.innerText = "✊ MEGA VACUUM ACTIVE"; }
                    else {
                        isGrabbing = false;
                        if (isILY) { updateTargetShape('heartText'); status.innerText = "🤟 I LOVE YOU"; }
                        else if (isPeace) { updateTargetShape('star'); status.innerText = "✌️ STAR MODE"; }
                        else if (isRevealed && !isExploded) { updateTargetShape('photo'); status.innerText = "Memory Re-formed"; }
                    }
                }
            });

            const cameraPipe = new Camera(document.getElementById('input_video'), {
                onFrame: async () => {
                    await faceMesh.send({image: document.getElementById('input_video')});
                    await hands.send({image: document.getElementById('input_video')});
                }, width: 640, height: 480
            });
            cameraPipe.start();
        }

        function animate() {
            requestAnimationFrame(animate);
            const pos = particleSystem.geometry.attributes.position;
            const target = particleSystem.geometry.attributes.target;
            const speed = isRevealed ? (isExploded ? 0.05 : 0.08) : 0.005;

            for(let i=0; i<PARTICLE_COUNT; i++) {
                const ix = i*3, iy = i*3+1, iz = i*3+2;
                if (isGrabbing && isRevealed) {
                    // STRONGER FIST: Increased pull speed + Vortex effect
                    let dx = handPos.x - pos.array[ix];
                    let dy = handPos.y - pos.array[iy];
                    let dz = handPos.z - pos.array[iz];
                    
                    pos.array[ix] += dx * 0.35 + dy * 0.1; // Added slight swirl
                    pos.array[iy] += dy * 0.35 - dx * 0.1;
                    pos.array[iz] += dz * 0.35;
                } else {
                    pos.array[ix] += (target.array[ix] - pos.array[ix]) * speed;
                    pos.array[iy] += (target.array[iy] - pos.array[iy]) * speed;
                    pos.array[iz] += (target.array[iz] - pos.array[iz]) * speed;
                }
            }
            pos.needsUpdate = true;
            camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetZoom, 0.05);
            particleSystem.rotation.y += isGrabbing ? 0.02 : 0.001; // Spins faster when grabbing
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
