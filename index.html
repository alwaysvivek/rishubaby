<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishu's World | Hand Tracking Fix</title>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #gate {
            position: fixed; inset: 0; background: #000; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;
        }
        .btn {
            background: #ff69b4; color: white; border: none; padding: 20px 50px;
            border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1.2rem;
        }
        #webcam {
            position: fixed; bottom: 10px; left: 10px; width: 140px; height: 100px;
            border: 2px solid #ff69b4; z-index: 50; transform: scaleX(-1); border-radius: 10px;
        }
        #ui {
            position: fixed; top: 10%; width: 100%; text-align: center;
            pointer-events: none; color: white; z-index: 10;
        }
        .floating-img {
            position: fixed; width: 180px; display: none; border-radius: 15px;
            box-shadow: 0 0 30px #ff69b4; z-index: 5;
        }
        #hint {
            position: fixed; bottom: 20px; width: 100%; text-align: center;
            color: rgba(255,255,255,0.5); font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div id="gate">
        <button class="btn" onclick="startApp()">START MAGIC</button>
    </div>

    <div id="ui">
        <h1 id="title" style="letter-spacing: 8px;">READY...</h1>
        <div id="status" style="color: #ff69b4; font-weight: bold;">WAVE YOUR HAND</div>
    </div>

    <video id="webcam" autoplay playsinline></video>

    <img id="imgA" src="https://github.com/alwaysvivek/rishubaby/blob/main/a.png?raw=true" class="floating-img" style="left: 10%; top: 30%;">
    <img id="imgABC" src="https://github.com/alwaysvivek/rishubaby/blob/main/abc.JPG?raw=true" class="floating-img" style="right: 10%; top: 30%;">

    <div id="hint">CLOSE FINGERS = PINCH | WIDE HAND = BRIDGE | RELAXED = NORMAL</div>

    <audio id="bgMusic" src="https://github.com/alwaysvivek/rishubaby/blob/main/1.mp3?raw=true" loop></audio>

    <script>
        const COMPLIMENTS = ["Meri Jaan ❤️", "Prettiest Girl ✨", "Rishubabu 😽", "Cutiepie 🥧", "Rishubarbie 🎀"];
        let scene, camera, renderer, particles, pData = [];
        let hX = 0, hY = 0, currentG = "NONE";
        const count = 1000;
        const dummy = new THREE.Object3D();

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 15;
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const mat = new THREE.MeshStandardMaterial({ color: 0xff69b4, emissive: 0xff1493, emissiveIntensity: 1.5 });
            particles = new THREE.InstancedMesh(new THREE.SphereGeometry(0.12, 6, 6), mat, count);

            for (let i = 0; i < count; i++) {
                pData.push({
                    t: Math.random() * 100,
                    speed: 0.02 + Math.random() * 0.03,
                    radius: 3 + Math.random() * 7,
                    noise: new THREE.Vector3((Math.random()-0.5)*4, (Math.random()-0.5)*4, (Math.random()-0.5)*4)
                });
            }
            scene.add(particles, new THREE.AmbientLight(0xffffff, 1));
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            pData.forEach((p, i) => {
                p.t += p.speed;
                let x = Math.cos(p.t) * p.radius;
                let y = Math.sin(p.t) * p.radius;
                let z = Math.sin(p.t * 0.5) * 2;

                if (currentG === "PINCH") {
                    x = THREE.MathUtils.lerp(x, hX + p.noise.x, 0.1);
                    y = THREE.MathUtils.lerp(y, hY + p.noise.y, 0.1);
                } else if (currentG === "BRIDGE") {
                    x = THREE.MathUtils.lerp(-18, 18, i/count);
                    y = Math.sin(time * 3 + i * 0.2) * 2;
                }

                dummy.position.set(x, y, z);
                dummy.scale.setScalar(0.7 + Math.sin(p.t)*0.3);
                dummy.updateMatrix();
                particles.setMatrixAt(i, dummy.matrix);
            });
            particles.instanceMatrix.needsUpdate = true;
            renderer.render(scene, camera);
        }

        function startApp() {
            document.getElementById('gate').style.display = 'none';
            document.getElementById('bgMusic').play();
            initThree();
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.5 });
            
            hands.onResults((res) => {
                if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
                    const pts = res.multiHandLandmarks[0];
                    hX = (0.5 - pts[8].x) * 35; hY = (0.5 - pts[8].y) * 25;
                    
                    // EASIER DETECTION LOGIC
                    const thumb = pts[4], index = pts[8], pinky = pts[20];
                    const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
                    const bridgeDist = Math.hypot(thumb.x - pinky.x, thumb.y - pinky.y);

                    if (pinchDist < 0.1) { // Wider pinch range
                        currentG = "PINCH";
                        setUI("CATCHING HEARTS", COMPLIMENTS[Math.floor(Date.now()/1500 % 5)]);
                    } else if (bridgeDist > 0.4) { // Trigger bridge if thumb and pinky are far
                        currentG = "BRIDGE";
                        setUI("MUMBAI TO DELHI", "LONG DISTANCE LOVE");
                        imgs(true);
                    } else {
                        currentG = "NONE";
                        setUI("TRACKING...", "RISHUBARBIE");
                        imgs(false);
                    }
                }
            });

            const camInst = new Camera(document.getElementById('webcam'), {
                onFrame: async () => { await hands.send({ image: document.getElementById('webcam') }); },
                width: 640, height: 480
            });
            camInst.start();
            animate();
        }

        function setUI(s, t) { document.getElementById('status').innerText = s; document.getElementById('title').innerText = t; }
        function imgs(s) { document.getElementById('imgA').style.display = s?'block':'none'; document.getElementById('imgABC').style.display = s?'block':'none'; }
    </script>
</body>
</html>
