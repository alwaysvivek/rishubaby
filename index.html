<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crack the Horizontal Egg 🥚✨</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #gate { position: fixed; inset: 0; background: #000; z-index: 200; display: flex; justify-content: center; align-items: center; }
        .btn { background: #fff; padding: 15px 30px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 0 20px rgba(255,255,255,0.4); }
        
        #ui { position: absolute; top: 20px; left: 20px; color: white; z-index: 10; pointer-events: none; }
        #status { font-weight: bold; font-size: 1.4rem; color: #ff0077; margin-bottom: 10px; text-transform: uppercase; text-shadow: 0 0 10px rgba(255,0,119,0.5); }
        .guide { font-size: 13px; opacity: 0.8; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 12px; border: 1px solid #333; line-height: 1.6; backdrop-filter: blur(5px); }
        
        #video-container { position: absolute; bottom: 20px; right: 20px; width: 180px; height: 135px; border: 2px solid #ff0077; border-radius: 10px; overflow: hidden; transform: scaleX(-1); opacity: 0.4; }
        video { width: 100%; height: 100%; object-fit: cover; }

        #hint {
            position: fixed; bottom: 10%; left: 50%; transform: translateX(-50%);
            color: white; text-align: center; z-index: 5; letter-spacing: 2px; text-transform: uppercase; font-size: 12px; opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="gate">
        <button class="btn" onclick="initExperience()">Begin the Magic ✨</button>
    </div>

    <div id="ui">
        <div id="status">The Egg Awaits...</div>
        <div class="guide" id="guide-box" style="display: none;">
            🤟 <b>ILY:</b> Form "I ❤️ U"<br>
            ✊ <b>Fist:</b> MEGA VACUUM<br>
            ✌️ <b>Peace:</b> Star Mode<br>
            👐 <b>Hands Apart:</b> Zoom Photo
        </div>
    </div>

    <div id="hint">Pinch both hands & pull apart to crack horizontally!</div>

    <div id="video-container"><video id="input_video"></video></div>
    <audio id="song" src="1.mp3" loop></audio>

    <script>
        let scene, camera, renderer, particleSystem, stars;
        let isRevealed = false, isGrabbing = false, isExploded = false;
        let targetZoom = 35, lastHandDist = 0, crackProgress = 0;
        let handPos = new THREE.Vector3(0, 0, 0);
        const PARTICLE_COUNT = 9000;

        const shapes = {
            eggHorizontal: (i) => {
                const t = Math.random() * Math.PI * 2;
                const u = Math.random() * Math.PI;
                const r = 10;
                // Swapped X and Y multipliers to make it horizontal
                const x = r * Math.sin(u) * Math.cos(t) * 1.5; 
                const y = r * Math.sin(u) * Math.sin(t) * 0.8;
                const z = r * Math.cos(u) * 0.8;
                return new THREE.Vector3(x, y, z);
            },
            photo: (i) => {
                const x = (i % 100) - 50;
                const y = 45 - Math.floor(i / 100);
                return new THREE.Vector3(x * 0.45, y * 0.45, 0);
            },
            heartText: (i) => {
                const section = i % 3;
                if (section === 0) return new THREE.Vector3(-12, (Math.random() * 10) - 5, (Math.random()-0.5)); 
                if (section === 1) { 
                    const t = Math.random() * Math.PI * 2;
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    return new THREE.Vector3(x * 0.45, y * 0.45, (Math.random()-0.5) * 2);
                }
                const t = (Math.random() * Math.PI) + Math.PI;
                return new THREE.Vector3(Math.cos(t) * 5 + 12, Math.sin(t) * 7 + 2, 0);
            },
            star: (i) => {
                const arms = 5;
                const angle = (i % arms) * (Math.PI * 2 / arms);
                const r = Math.random() * 15;
                return new THREE.Vector3(Math.cos(angle) * r, Math.sin(angle) * r, (Math.random()-0.5)*5);
            }
        };

        function initExperience() {
            document.getElementById('gate').style.display = 'none';
            document.getElementById('song').play();
            
            const img = new Image();
            img.src = 'a.png';
            img.crossOrigin = "Anonymous";
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 100; canvas.height = 90;
                ctx.drawImage(img, 0, 0, 100, 90);
                const imgData = ctx.getImageData(0, 0, 100, 90).data;
                setupThree(imgData);
                initTracking();
            };
        }

        function setupThree(imgData) {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
            camera.position.z = 50;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const starGeo = new THREE.BufferGeometry();
            const starPos = new Float32Array(2000 * 3);
            for(let i=0; i<6000; i++) starPos[i] = (Math.random()-0.5) * 1000;
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.6 });
            stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);

            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            const targets = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);

            for(let i=0; i<PARTICLE_COUNT; i++) {
                const p = shapes.eggHorizontal(i);
                pos[i*3] = p.x; pos[i*3+1] = p.y; pos[i*3+2] = p.z;
                targets[i*3] = p.x; targets[i*3+1] = p.y; targets[i*3+2] = p.z;
                colors[i*3] = 1; colors[i*3+1] = 1; colors[i*3+2] = 1; 
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('target', new THREE.BufferAttribute(targets, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({ size: 0.22, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending });
            particleSystem = new THREE.Points(geo, mat);
            scene.add(particleSystem);
            particleSystem.userData.imgColors = imgData;
            animate();
        }

        function revealPhoto() {
            isRevealed = true;
            document.getElementById('hint').style.display = 'none';
            document.getElementById('guide-box').style.display = 'block';
            document.getElementById('status').innerText = "Memory Revealed ✨";
            
            const colorAttr = particleSystem.geometry.attributes.color;
            const imgData = particleSystem.userData.imgColors;
            for(let i=0; i<PARTICLE_COUNT; i++) {
                colorAttr.array[i*3] = imgData[i*4]/255;
                colorAttr.array[i*3+1] = imgData[i*4+1]/255;
                colorAttr.array[i*3+2] = imgData[i*4+2]/255;
            }
            colorAttr.needsUpdate = true;
            updateTargetShape('photo');
        }

        function updateTargetShape(name) {
            const tAttr = particleSystem.geometry.attributes.target;
            for(let i=0; i<PARTICLE_COUNT; i++) {
                const p = shapes[name](i);
                tAttr.array[i*3] = p.x; tAttr.array[i*3+1] = p.y; tAttr.array[i*3+2] = p.z;
            }
            tAttr.needsUpdate = true;
        }

        function initTracking() {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({maxNumHands: 2, minDetectionConfidence: 0.7});

            hands.onResults(results => {
                const status = document.getElementById('status');
                if (results.multiHandLandmarks?.length > 0) {
                    const h1 = results.multiHandLandmarks[0];
                    handPos.set((h1[9].x - 0.5) * -55, (h1[9].y - 0.5) * -45, h1[9].z * 35);

                    if (!isRevealed && results.multiHandLandmarks.length === 2) {
                        const h2 = results.multiHandLandmarks[1];
                        // Easier Pinch detection: Distance between thumb tip(4) and index tip(8)
                        const pinch1 = Math.hypot(h1[4].x - h1[8].x, h1[4].y - h1[8].y) < 0.08;
                        const pinch2 = Math.hypot(h2[4].x - h2[8].x, h2[4].y - h2[8].y) < 0.08;

                        if (pinch1 && pinch2) {
                            const currentDist = Math.abs(h1[9].x - h2[9].x);
                            if (lastHandDist > 0) {
                                // Accumulate progress if hands are moving apart
                                let movement = Math.max(0, currentDist - lastHandDist);
                                crackProgress += movement * 10;
                            }
                            lastHandDist = currentDist;
                            status.innerText = "TEARING APART...";
                        } else { lastHandDist = 0; }
                        
                        if (crackProgress > 1.0) revealPhoto();
                    }

                    if (isRevealed) {
                        if (results.multiHandLandmarks.length === 2) {
                            const h2 = results.multiHandLandmarks[1];
                            targetZoom = THREE.MathUtils.mapLinear(Math.hypot(h1[9].x - h2[9].x, h1[9].y - h2[9].y), 0.1, 0.7, 60, 5);
                        }
                        const isFist = [8, 12, 16, 20].every(i => h1[i].y > h1[i-2].y);
                        const isILY = h1[8].y < h1[6].y && h1[20].y < h1[18].y && h1[12].y > h1[10].y;
                        const isPeace = h1[8].y < h1[6].y && h1[12].y < h1[10].y && h1[16].y > h1[14].y;

                        if (isFist) { isGrabbing = true; status.innerText = "✊ MEGA VACUUM"; }
                        else {
                            isGrabbing = false;
                            if (isILY) { updateTargetShape('heartText'); status.innerText = "🤟 I LOVE YOU"; }
                            else if (isPeace) { updateTargetShape('star'); status.innerText = "✌️ STAR MODE"; }
                            else { updateTargetShape('photo'); status.innerText = "Memory Pulsing..."; }
                        }
                    }
                }
            });

            const cameraPipe = new Camera(document.getElementById('input_video'), {
                onFrame: async () => { await hands.send({image: document.getElementById('input_video')}); },
                width: 640, height: 480
            });
            cameraPipe.start();
        }

        function animate() {
            requestAnimationFrame(animate);
            const pos = particleSystem.geometry.attributes.position;
            const target = particleSystem.geometry.attributes.target;
            const time = Date.now() * 0.002;
            let pulse = (isRevealed && !isGrabbing) ? (1.0 + Math.sin(time * 1.5) * 0.05) : 1.0;
            const speed = isRevealed ? 0.08 : 0.05;

            for(let i=0; i<PARTICLE_COUNT; i++) {
                const ix = i*3, iy = i*3+1, iz = i*3+2;
                if (isGrabbing && isRevealed) {
                    let dx = handPos.x - pos.array[ix], dy = handPos.y - pos.array[iy], dz = handPos.z - pos.array[iz];
                    pos.array[ix] += dx * 0.35 + dy * 0.1;
                    pos.array[iy] += dy * 0.35 - dx * 0.1;
                    pos.array[iz] += dz * 0.35;
                } else {
                    pos.array[ix] += (target.array[ix] * pulse - pos.array[ix]) * speed;
                    pos.array[iy] += (target.array[iy] * pulse - pos.array[iy]) * speed;
                    pos.array[iz] += (target.array[iz] * pulse - pos.array[iz]) * speed;
                    // Visual "shake" proportional to how much she has cracked it
                    if (!isRevealed && crackProgress > 0) {
                        pos.array[ix] += (Math.random()-0.5) * crackProgress * 1.5;
                        pos.array[iy] += (Math.random()-0.5) * crackProgress * 1.5;
                    }
                }
            }
            pos.needsUpdate = true;
            stars.rotation.y += 0.0005;
            particleSystem.rotation.y += isGrabbing ? 0.02 : 0.001;
            camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetZoom, 0.05);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
