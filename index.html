<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shatter & 3D Grid Morph</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #0f0; }
        #video { position: absolute; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; transform: scaleX(-1); }
        #crackCanvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        #threeContainer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 20; display: none; }
        
        #ui {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); padding: 15px 25px; border-radius: 5px;
            z-index: 101; border: 1px solid #0f0; text-align: center;
        }

        #depth-meter {
            width: 200px; height: 10px; background: #222; margin-top: 10px; border: 1px solid #0f0;
        }
        #depth-bar { width: 0%; height: 100%; background: #0f0; transition: width 0.1s; }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <canvas id="crackCanvas"></canvas>
    <div id="threeContainer"></div>
    
    <div id="ui">
        <div id="status">AWAITING IMPACT (0/2)</div>
        <div id="depth-meter"><div id="depth-bar"></div></div>
        <small style="font-size: 0.6rem;">LEAN IN UNTIL BAR IS FULL</small>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">
        const video = document.getElementById('video');
        const canvas = document.getElementById('crackCanvas');
        const ctx = canvas.getContext('2d');
        const uiStatus = document.getElementById('status');
        const depthBar = document.getElementById('depth-bar');
        const threeContainer = document.getElementById('threeContainer');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let hitCount = 0;
        const maxHits = 2; 
        let isDead = false, isMorphed = false, isExploded = false;
        let lastHitTime = 0;
        let scene, camera, renderer, particleSystem, targetPositions;

        // --- 1. Mediapipe Setup ---
        const faceMesh = new FaceMesh({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });

        const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        hands.setOptions({ maxNumHands: 2, minDetectionConfidence: 0.6 });

        faceMesh.onResults((results) => {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks[0]) {
                const nose = results.multiFaceLandmarks[0][1];
                
                // Visualization of depth for user
                // Normal Z range is approx 0.0 to -0.15. We map this to 0-100%
                let depthPercent = Math.min(Math.max((Math.abs(nose.z) * 600), 0), 100);
                depthBar.style.width = depthPercent + "%";

                if (!isDead) {
                    // Easier Trigger: If bar is over 85% full
                    if (depthPercent > 85 && (Date.now() - lastHitTime > 1500)) {
                        lastHitTime = Date.now();
                        hitCount++;
                        triggerShatter(nose.x * window.innerWidth, nose.y * window.innerHeight);
                    }
                } else {
                    // Proximity Zoom: Camera Z moves with your face
                    let zoomZ = 150 + (nose.z * 500);
                    if(camera) camera.position.z += (zoomZ - camera.position.z) * 0.1;
                }
            }
        });

        hands.onResults((results) => {
            if (isDead && results.multiHandLandmarks?.length === 2) {
                const h1 = results.multiHandLandmarks[0][8];
                const h2 = results.multiHandLandmarks[1][8];
                const w1 = results.multiHandLandmarks[0][0];
                const w2 = results.multiHandLandmarks[1][0];

                // Heart detection (index tips together)
                if (!isMorphed && Math.hypot(h1.x - h2.x, h1.y - h2.y) < 0.06) {
                    morphToLove();
                }
                // Clap detection (wrists together)
                if (isMorphed && !isExploded && Math.hypot(w1.x - w2.x, w1.y - w2.y) < 0.12) {
                    explode();
                }
            }
        });

        // Start Camera
        async function run() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            const pred = async () => {
                await faceMesh.send({ image: video });
                await hands.send({ image: video });
                requestAnimationFrame(pred);
            };
            pred();
        }
        run();

        function triggerShatter(x, y) {
            uiStatus.innerText = `CRITICAL FAILURE: ${hitCount}/2`;
            new Audio('https://www.soundjay.com/misc/sounds/glass-break-1.mp3').play().catch(()=>{});
            
            ctx.strokeStyle = "rgba(255,255,255,0.9)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i=0; i<15; i++) {
                ctx.moveTo(x, y);
                let a = Math.random() * Math.PI * 2;
                ctx.lineTo(x + Math.cos(a) * 300, y + Math.sin(a) * 300);
            }
            ctx.stroke();

            if (hitCount >= maxHits) start3D();
        }

        function start3D() {
            isDead = true;
            video.style.display = 'none';
            canvas.style.display = 'none';
            threeContainer.style.display = 'block';
            uiStatus.innerText = "HEART GESTURE TO REVEAL MESSAGE";

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            threeContainer.appendChild(renderer.domElement);

            const count = 8000;
            const currentPos = new Float32Array(count * 3);
            targetPositions = new Float32Array(count * 3);

            // Create Grid Cube
            let side = 20; 
            let idx = 0;
            for(let x=0; x<side; x++) {
                for(let y=0; y<side; y++) {
                    for(let z=0; z<side; z++) {
                        if(idx >= count*3) break;
                        targetPositions[idx] = (x - 10) * 8;
                        targetPositions[idx+1] = (y - 10) * 8;
                        targetPositions[idx+2] = (z - 10) * 8;
                        currentPos[idx] = targetPositions[idx];
                        currentPos[idx+1] = targetPositions[idx+1];
                        currentPos[idx+2] = targetPositions[idx+2];
                        idx += 3;
                    }
                }
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(currentPos, 3));
            const mat = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.7, blending: THREE.AdditiveBlending });
            particleSystem = new THREE.Points(geo, mat);
            scene.add(particleSystem);
            camera.position.z = 150;

            function loop() {
                requestAnimationFrame(loop);
                const positions = particleSystem.geometry.attributes.position.array;
                for(let i=0; i<positions.length; i++) {
                    positions[i] += (targetPositions[i] - positions[i]) * 0.08;
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
                particleSystem.rotation.y += 0.005;
                renderer.render(scene, camera);
            }
            loop();
        }

        function morphToLove() {
            isMorphed = true;
            particleSystem.material.color.set(0xff0055);
            uiStatus.innerText = "I LOVE YOU - CLAP TO END";
            for(let i=0; i<targetPositions.length; i+=3) {
                targetPositions[i] *= 1.2; 
                targetPositions[i+1] *= 0.1; // Flatten into text line
                targetPositions[i+2] = 0;
            }
        }

        function explode() {
            isExploded = true;
            uiStatus.innerText = "SHATTERED.";
            for(let i=0; i<targetPositions.length; i++) {
                targetPositions[i] += (Math.random()-0.5) * 1500;
            }
        }
    </script>
</body>
</html>
