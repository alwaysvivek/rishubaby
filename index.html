<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Crack Surprise</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #video { 
            position: absolute; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: 1; transform: scaleX(-1); 
        }

        /* The canvas where the "glass" breaks */
        #crackCanvas {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 10; pointer-events: none;
        }

        /* Screen glitch effect when hit */
        .glitch {
            animation: shake 0.2s lightspeed;
            filter: contrast(150%) brightness(120%) hue-rotate(90deg);
        }

        @keyframes shake {
            0% { transform: translate(0,0); }
            25% { transform: translate(5px, -5px); }
            50% { transform: translate(-5px, 5px); }
            100% { transform: translate(0,0); }
        }

        #message {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white; font-size: 4rem; font-weight: 900;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 40px rgba(255, 0, 100, 0.8);
            opacity: 0; transition: opacity 2s ease-in;
            z-index: 100; text-transform: uppercase;
            letter-spacing: 10px;
        }

        #ui {
            position: absolute; bottom: 40px; left: 50%;
            transform: translateX(-50%);
            color: white; background: rgba(0,0,0,0.7);
            padding: 15px 30px; border-radius: 50px; z-index: 100;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <canvas id="crackCanvas"></canvas>
    <div id="ui">Move closer to the glass...</div>
    <div id="message">I LOVE U</div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script type="module">
        const video = document.getElementById('video');
        const canvas = document.getElementById('crackCanvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('ui');
        const message = document.getElementById('message');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let isCracked = false;

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });

        faceMesh.onResults((results) => {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks[0] && !isCracked) {
                const nose = results.multiFaceLandmarks[0][1];
                // Trigger when head is very close (Z-axis threshold)
                if (nose.z < -0.15) { 
                    triggerRealisticCrack(nose.x * canvas.width, nose.y * canvas.height);
                }
            }
        });

        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
            video.srcObject = stream;
            const predict = async () => {
                await faceMesh.send({ image: video });
                requestAnimationFrame(predict);
            };
            predict();
        });

        function triggerRealisticCrack(centerX, centerY) {
            isCracked = true;
            ui.style.display = 'none';
            document.body.classList.add('glitch');
            setTimeout(() => document.body.classList.remove('glitch'), 300);

            // 1. Draw the Impact Point (Black "dead" pixels)
            ctx.fillStyle = "rgba(0, 0, 0, 0.95)";
            ctx.beginPath();
            ctx.arc(centerX, centerY, 15, 0, Math.PI * 2);
            ctx.fill();

            // 2. Draw Spider-web cracks
            drawSpiderCracks(centerX, centerY);

            // 3. Draw LCD Rainbow Bleed (Vertical/Horizontal lines)
            drawLCDBleed(centerX, centerY);

            message.style.opacity = "1";
        }

        function drawSpiderCracks(x, y) {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
            ctx.lineWidth = 0.5;

            // Multiple radial shards
            for (let i = 0; i < 25; i++) {
                let currX = x;
                let currY = y;
                let angle = Math.random() * Math.PI * 2;
                let segments = 5 + Math.random() * 10;
                
                ctx.beginPath();
                ctx.moveTo(x, y);
                
                for (let j = 0; j < segments; j++) {
                    currX += Math.cos(angle) * (Math.random() * 80);
                    currY += Math.sin(angle) * (Math.random() * 80);
                    angle += (Math.random() - 0.5) * 0.5; // Slight deviation
                    ctx.lineTo(currX, currY);
                }
                ctx.stroke();
            }
        }

        function drawLCDBleed(x, y) {
            // Draw a few vertical "dead pixel" stripes
            const colors = ['#ff00ff', '#00ffff', '#ffffff', '#000000'];
            for (let i = 0; i < 12; i++) {
                const stripeX = x + (Math.random() - 0.5) * 200;
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                ctx.globalAlpha = 0.6;
                ctx.fillRect(stripeX, 0, Math.random() * 3, canvas.height);
            }

            // Darker "ink leak" around the hit
            const gradient = ctx.createRadialGradient(x, y, 5, x, y, 60);
            gradient.addColorStop(0, "black");
            gradient.addColorStop(1, "transparent");
            ctx.fillStyle = gradient;
            ctx.globalAlpha = 0.8;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
