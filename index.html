<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person ❤️</title>
    <style>
        :root {
            --primary: #ff4d6d;
            --secondary: #ffb7c5;
            --dark: #1a0505;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #2b0a0a 0%, #000000 100%);
            font-family: 'Georgia', serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Floating Hearts Background */
        .heart-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.4;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
            animation: fadeIn 2s ease-in;
        }

        h1 {
            font-size: 3rem;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(255, 77, 109, 0.5);
            margin-bottom: 10px;
        }

        /* Image Gallery Section */
        .photo-gallery {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .photo-gallery img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--primary);
            box-shadow: 0 0 15px var(--primary);
            transition: transform 0.3s ease;
        }

        .photo-gallery img:hover {
            transform: scale(1.1) rotate(5deg);
        }

        /* Music Player Styling */
        .music-player {
            background: rgba(255, 77, 109, 0.2);
            padding: 15px 25px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            margin-bottom: 30px;
            border: 1px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        audio {
            height: 30px;
            filter: sepia(100%) saturate(300%) hue-rotate(-50deg);
            /* Colorize to match theme */
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 1000px;
            padding-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 77, 109, 0.3);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }

        .card:hover {
            transform: translateY(-10px);
            background: rgba(255, 77, 109, 0.15);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.3);
        }

        .date {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--secondary);
            margin-bottom: 10px;
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        footer {
            margin-top: auto;
            padding: 20px;
            opacity: 0.6;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <canvas class="heart-bg" id="heartCanvas"></canvas>

    <header>
        <h1>Babuwa Rishu! ❤️</h1>
        <div class="photo-gallery">
            <img src="a.png" alt="Rishu 1">
            <img src="abc.JPG" alt="Rishu 2">
        </div>

        <a href="studio.html"
            style="display: inline-block; padding: 12px 30px; background: #ff69b4; color: white; text-decoration: none; border-radius: 50px; font-weight: 900; box-shadow: 0 0 20px rgba(255, 105, 180, 0.6); transition: transform 0.3s ease; margin: 10px 0 20px 0; font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 1px;">✨
            Barbie Sticker Studio ✨</a>

        <div class="music-player">
            <span>🎵 Our Song:</span>
            <audio controls loop>
                <source src="1.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
    </header>

    <main class="grid-container">
        <a href="rose.html" class="card">
            <span class="date">Feb 7</span>
            <div style="font-size: 3rem;">🌹</div>
            <h2>Rose Day</h2>
            <p>A flower that blooms only when you smile.</p>
        </a>

        <a href="chocolate.html" class="card">
            <span class="date">Feb 9</span>
            <div style="font-size: 3rem;">🍫</div>
            <h2>Chocolate Day</h2>
            <p> Grab a bite.</p>
        </a>

        <a href="teddy.html" class="card">
            <span class="date">Feb 10</span>
            <div style="font-size: 3rem;">🧸</div>
            <h2>Teddy Day</h2>
            <p>my fav teddy</p>
        </a>
    </main>

    <footer>Made with ❤️ for Rishu</footer>

    <script>
        // Floating heart animation logic
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        let hearts = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        class Heart {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20;
                this.size = Math.random() * 15 + 5;
                this.speed = Math.random() * 1 + 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() { this.y -= this.speed; if (this.y < -20) this.reset(); }
            draw() {
                ctx.fillStyle = `rgba(255, 77, 109, ${this.opacity})`;
                ctx.font = `${this.size}px Arial`;
                ctx.fillText('❤️', this.x, this.y);
            }
        }
        function init() {
            resize();
            for (let i = 0; i < 30; i++) hearts.push(new Heart());
            animate();
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hearts.forEach(h => { h.update(); h.draw(); });
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', resize);
        init();
    </script>
</body>

</html>
