<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Tracked 3D Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; pointer-events: none; text-shadow: 1px 1px 2px black; }
        canvas { display: block; }
        video { 
            transform: scaleX(-1); 
            position: absolute; 
            bottom: 10px; right: 10px; 
            width: 160px; 
            border: 2px solid #444; 
            border-radius: 8px; 
        }
    </style>
</head>
<body>

<div id="ui">
    <h1>Gesture Particles</h1>
    <p>Show hand to begin.</p>
    <p>• Pinch to Explode/Change Color<br>• Move hand to Rotate System<br>• Index finger attracts particles</p>
    <p id="shape-name">Current Shape: Sphere</p>
</div>

<video id="video" autoplay playsinline muted></video>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { Hands } from "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js";
import { Camera } from "https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js";

// --- Config ---
const PARTICLE_COUNT = 5000;
const shapes = ['Sphere', 'Heart', 'Saturn', 'Firework'];
let currentShapeIndex = 0;

// --- Three.js Setup ---
const scene = new THREE.Scene();
const camera3D = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
camera3D.position.z = 5;

// Particle Buffers
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLE_COUNT * 3);
const targetPositions = new Float32Array(PARTICLE_COUNT * 3);
const colors = new Float32Array(PARTICLE_COUNT * 3);

for (let i = 0; i < PARTICLE_COUNT; i++) {
    positions[i*3] = (Math.random() - 0.5) * 10;
    positions[i*3+1] = (Math.random() - 0.5) * 10;
    positions[i*3+2] = (Math.random() - 0.5) * 10;
    colors[i*3] = colors[i*3+1] = colors[i*3+2] = 1;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
    size: 0.05,
    vertexColors: true,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});

const particleSystem = new THREE.Points(geometry, material);
scene.add(particleSystem);

// --- Shape Logic ---
function setShape(type) {
    document.getElementById('shape-name').innerText = `Current Shape: ${type}`;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
        let x, y, z;
        if (type === 'Sphere') {
            const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
            const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
            x = 2 * Math.cos(theta) * Math.sin(phi);
            y = 2 * Math.sin(theta) * Math.sin(phi);
            z = 2 * Math.cos(phi);
        } else if (type === 'Heart') {
            const t = (i / PARTICLE_COUNT) * Math.PI * 2;
            x = 0.15 * (16 * Math.pow(Math.sin(t), 3));
            y = 0.15 * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            z = (Math.random() - 0.5) * 0.5;
        } else if (type === 'Saturn') {
            if (i < PARTICLE_COUNT * 0.4) {
                const phi = Math.random()*Math.PI*2;
                const theta = Math.random()*Math.PI;
                x = 1.2 * Math.cos(phi)*Math.sin(theta);
                y = 1.2 * Math.sin(phi)*Math.sin(theta);
                z = 1.2 * Math.cos(theta);
            } else {
                const angle = Math.random()*Math.PI*2;
                const radius = 1.8 + Math.random()*0.8;
                x = radius * Math.cos(angle);
                y = radius * Math.sin(angle)*0.3;
                z = radius * Math.sin(angle);
            }
        } else if (type === 'Firework') {
            const r = Math.random() * 3;
            const phi = Math.random() * Math.PI * 2;
            const theta = Math.random() * Math.PI;
            x = r*Math.cos(phi)*Math.sin(theta);
            y = r*Math.sin(phi)*Math.sin(theta);
            z = r*Math.cos(theta);
        }
        targetPositions[i*3]=x; targetPositions[i*3+1]=y; targetPositions[i*3+2]=z;
    }
}
setShape('Sphere');

// --- Camera / Hand Tracking Fix ---
const videoElement = document.getElementById('video');
let handX=0, handY=0, isPinching=false;

async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        videoElement.srcObject = stream;
        await videoElement.play();
        return true;
    } catch(e) {
        alert("Camera access denied or unavailable");
        return false;
    }
}

const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

hands.onResults((results)=>{
    if(!results.multiHandLandmarks?.length) return;
    const lm = results.multiHandLandmarks[0];

    handX = (lm[8].x-0.5)*10;
    handY = -(lm[8].y-0.5)*10;

    const dx = lm[4].x - lm[8].x;
    const dy = lm[4].y - lm[8].y;
    const dist = Math.sqrt(dx*dx+dy*dy);

    if(dist < 0.05 && !isPinching){
        isPinching=true;
        currentShapeIndex=(currentShapeIndex+1)%shapes.length;
        setShape(shapes[currentShapeIndex]);
        changeColors();
    } else if(dist > 0.1){ isPinching=false; }

    particleSystem.rotation.y = THREE.MathUtils.lerp(particleSystem.rotation.y, (lm[0].x-0.5)*2, 0.1);
    particleSystem.rotation.x = THREE.MathUtils.lerp(particleSystem.rotation.x, (lm[0].y-0.5)*2, 0.1);
});

function changeColors(){
    const r=Math.random(), g=Math.random(), b=Math.random();
    const colAttr = geometry.attributes.color;
    for(let i=0;i<PARTICLE_COUNT;i++){
        colAttr.setXYZ(i, r+Math.random()*0.2, g+Math.random()*0.2, b+Math.random()*0.2);
    }
    colAttr.needsUpdate=true;
}

// --- Boot ---
(async()=>{
    const ok = await initCamera();
    if(!ok) return;

    const cam = new Camera(videoElement,{
        onFrame: async()=>{ await hands.send({ image: videoElement }); },
        width:640,height:480
    });
    cam.start();
})();

// --- Animation ---
function animate(){
    requestAnimationFrame(animate);
    const posAttr = geometry.attributes.position;
    for(let i=0;i<PARTICLE_COUNT;i++){
        const px=posAttr.getX(i), py=posAttr.getY(i), pz=posAttr.getZ(i);
        let tx=targetPositions[i*3], ty=targetPositions[i*3+1], tz=targetPositions[i*3+2];

        if(isPinching){ tx*=2.5; ty*=2.5; tz*=2.5; }

        const dx = handX-px, dy=handY-py;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist<2){ tx+=dx*0.5; ty+=dy*0.5; }

        posAttr.setXYZ(i,
            THREE.MathUtils.lerp(px, tx, 0.05),
            THREE.MathUtils.lerp(py, ty, 0.05),
            THREE.MathUtils.lerp(pz, tz, 0.05)
        );
    }
    posAttr.needsUpdate=true;
    renderer.render(scene, camera3D);
}
animate();

window.addEventListener('resize',()=>{
    camera3D.aspect = window.innerWidth / window.innerHeight;
    camera3D.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
