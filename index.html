<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity & Particle Text Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; z-index: 10; pointer-events: none; }
        #status { font-weight: bold; font-size: 1.4rem; color: #ff0077; margin-bottom: 10px; text-transform: uppercase; }
        .guide { font-size: 13px; opacity: 0.8; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 12px; border: 1px solid #333; }
        #video-container { position: absolute; bottom: 20px; right: 20px; width: 180px; height: 135px; border: 2px solid #ff0077; border-radius: 10px; overflow: hidden; transform: scaleX(-1); opacity: 0.6; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="status">Ready...</div>
        <div class="guide">
            🤟 <b>ILY Gesture:</b> Spells "I ❤️ U" in particles<br>
            👌 <b>Pinch:</b> Zoom In / Out<br>
            ✊ <b>Fist:</b> Grab & Move Particles<br>
            ✌️ <b>Peace:</b> Star Shape
        </div>
    </div>

    <div id="video-container"><video id="input_video"></video></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        let scene, camera, renderer, particleSystem;
        const PARTICLE_COUNT = 9000;
        let handPos = new THREE.Vector3(0, 0, 0);
        let isGrabbing = false;
        let targetZoom = 20;

        // --- Particle Text and Shape Logic ---
        const shapes = {
            heartText: (i) => {
                // Divide particles into 3 groups for "I", "❤️", and "U"
                const section = i % 3;
                if (section === 0) { // The "I"
                    return new THREE.Vector3(-12, (Math.random() * 10) - 5, (Math.random()-0.5));
                } else if (section === 1) { // The Heart
                    const t = Math.random() * Math.PI * 2;
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    return new THREE.Vector3(x * 0.45, y * 0.45, (Math.random()-0.5) * 2);
                } else { // The "U"
                    const t = (Math.random() * Math.PI) + Math.PI; // Half circle
                    const x = Math.cos(t) * 5 + 12;
                    const y = Math.sin(t) * 7 + 2;
                    const vert = Math.random() > 0.5 ? 1 : 0;
                    if (vert) return new THREE.Vector3(x, y + (Math.random() * 5), (Math.random()-0.5));
                    return new THREE.Vector3(x, y, (Math.random()-0.5));
                }
            },
            star: (i) => {
                const arms = 5;
                const angle = (i % arms) * (Math.PI * 2 / arms);
                const r = Math.random() * 12;
                return new THREE.Vector3(Math.cos(angle) * r, Math.sin(angle) * r, (Math.random()-0.5)*2);
            },
            tornado: (i) => {
                const angle = 0.1 * i;
                return new THREE.Vector3(Math.cos(angle)*(i/450), (i/350)-12, Math.sin(angle)*(i/450));
            }
        };

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 20;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            const targets = new Float32Array(PARTICLE_COUNT * 3);

            for(let i=0; i<PARTICLE_COUNT; i++) {
                const p = shapes.heartText(i);
                pos[i*3] = p.x; pos[i*3+1] = p.y; pos[i*3+2] = p.z;
                targets[i*3] = p.x; targets[i*3+1] = p.y; targets[i*3+2] = p.z;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('target', new THREE.BufferAttribute(targets, 3));
            
            const mat = new THREE.PointsMaterial({ 
                color: 0xff0077, size: 0.12, transparent: true, blending: THREE.AdditiveBlending 
            });
            particleSystem = new THREE.Points(geo, mat);
            scene.add(particleSystem);
        }

        function updateTargetShape(shapeName) {
            const targetAttr = particleSystem.geometry.attributes.target;
            for(let i=0; i<PARTICLE_COUNT; i++) {
                const p = shapes[shapeName](i);
                targetAttr.array[i*3] = p.x;
                targetAttr.array[i*3+1] = p.y;
                targetAttr.array[i*3+2] = p.z;
            }
            targetAttr.needsUpdate = true;
        }

        function initTracking() {
            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.75 });

            hands.onResults(results => {
                const status = document.getElementById('status');
                if (results.multiHandLandmarks && results.multiHandLandmarks[0]) {
                    const hand = results.multiHandLandmarks[0];
                    
                    // 1. Grab Point
                    handPos.set((hand[9].x - 0.5) * -40, (hand[9].y - 0.5) * -30, (hand[9].z * 20));

                    // 2. Pinch Zoom Logic
                    const thumbTip = hand[4];
                    const indexTip = hand[8];
                    const distance = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
                    targetZoom = THREE.MathUtils.mapLinear(distance, 0.05, 0.3, 10, 40);

                    // 3. Gesture Detection
                    const isIndexUp = hand[8].y < hand[6].y;
                    const isMiddleUp = hand[12].y < hand[10].y;
                    const isPinkyUp = hand[20].y < hand[18].y;
                    const isFist = [8, 12, 16, 20].every(i => hand[i].y > hand[i-2].y);

                    if (isFist) {
                        isGrabbing = true;
                        status.innerText = "✊ GRAVITY GRAB";
                        particleSystem.material.color.set(0x00ffcc);
                    } else {
                        isGrabbing = false;
                        particleSystem.material.color.set(0xff0077);
                        
                        if (isIndexUp && isPinkyUp && !isMiddleUp) {
                            status.innerText = "🤟 I ❤️ U";
                            updateTargetShape('heartText');
                        } else if (isIndexUp && isMiddleUp && !isPinkyUp) {
                            status.innerText = "✌️ STAR MODE";
                            updateTargetShape('star');
                        } else if (isIndexUp && !isMiddleUp) {
                            status.innerText = "☝️ TORNADO";
                            updateTargetShape('tornado');
                        } else {
                            status.innerText = "🖐 TRACKING";
                        }
                    }
                }
            });

            const cameraPipe = new Camera(document.getElementById('input_video'), {
                onFrame: async () => { await hands.send({image: document.getElementById('input_video')}); },
                width: 640, height: 480
            });
            cameraPipe.start();
        }

        function animate() {
            requestAnimationFrame(animate);
            const posAttr = particleSystem.geometry.attributes.position;
            const targetAttr = particleSystem.geometry.attributes.target;

            for(let i=0; i<PARTICLE_COUNT; i++) {
                const ix = i*3, iy = i*3+1, iz = i*3+2;
                
                if (isGrabbing) {
                    posAttr.array[ix] += (handPos.x - posAttr.array[ix]) * 0.15;
                    posAttr.array[iy] += (handPos.y - posAttr.array[iy]) * 0.15;
                    posAttr.array[iz] += (handPos.z - posAttr.array[iz]) * 0.15;
                } else {
                    posAttr.array[ix] += (targetAttr.array[ix] - posAttr.array[ix]) * 0.08;
                    posAttr.array[iy] += (targetAttr.array[iy] - posAttr.array[iy]) * 0.08;
                    posAttr.array[iz] += (targetAttr.array[iz] - posAttr.array[iz]) * 0.08;
                }
            }
            
            posAttr.needsUpdate = true;
            
            // Smooth Camera Zoom
            camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetZoom, 0.1);
            
            particleSystem.rotation.y += 0.005;
            renderer.render(scene, camera);
        }

        initThree();
        initTracking();
        animate();
    </script>
</body>
</html>
