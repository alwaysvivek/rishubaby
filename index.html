<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper-Realistic Screen Break</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        
        #video { 
            position: absolute; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: 1; transform: scaleX(-1);
            transition: filter 0.2s ease;
        }

        #crackCanvas { 
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100vh; z-index: 10; pointer-events: none; 
            /* This filter adds that "glassy" glow to the white lines */
            filter: drop-shadow(0px 0px 1px rgba(255,255,255,0.8));
        }
        
        #message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 5rem; font-weight: 900; opacity: 0;
            z-index: 100; text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
            letter-spacing: 15px; text-transform: uppercase; pointer-events: none;
        }

        #ui {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: #0f0; background: rgba(0,0,0,0.8); padding: 10px 20px;
            border-radius: 5px; z-index: 101; border: 1px solid #0f0;
            text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px;
        }

        /* Impact flash and screen shake */
        .impact {
            animation: shake 0.15s cubic-bezier(.36,.07,.19,.97) both;
            filter: brightness(2) contrast(1.5);
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0) scaleX(-1); }
            20%, 80% { transform: translate3d(4px, 0, 0) scaleX(-1); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0) scaleX(-1); }
            40%, 60% { transform: translate3d(6px, 0, 0) scaleX(-1); }
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <canvas id="crackCanvas"></canvas>
    <div id="ui">AWAITING IMPACT...</div>
    <div id="message">i love u</div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script type="module">
        const video = document.getElementById('video');
        const canvas = document.getElementById('crackCanvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('ui');
        const message = document.getElementById('message');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let hitCount = 0;
        const maxHits = 7;
        let isDead = false;

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6 });

        faceMesh.onResults((results) => {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks[0] && !isDead) {
                const nose = results.multiFaceLandmarks[0][1];
                if (nose.z < -0.11) { 
                    hitCount++;
                    triggerImpact(nose.x * canvas.width, nose.y * canvas.height);
                }
            }
        });

        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
            video.srcObject = stream;
            const predict = async () => {
                await faceMesh.send({ image: video });
                requestAnimationFrame(predict);
            };
            predict();
        });

        function triggerImpact(x, y) {
            // Screen Feedback
            video.classList.add('impact');
            setTimeout(() => video.classList.remove('impact'), 200);

            // Realistic Glass Break Sound
            const audio = new Audio('https://www.soundjay.com/misc/sounds/glass-break-1.mp3');
            audio.playbackRate = 0.8 + Math.random() * 0.4; // Varied pitch for realism
            audio.play().catch(() => {});

            // 1. Draw 3D-effect cracks
            drawFracture(x, y);

            // 2. Add "Ink Leak" (Dead pixels)
            drawInkLeak(x, y);

            // 3. Add Chromatic Bleed (Vertical lines)
            drawChromaticLines(x);

            if (hitCount >= maxHits) {
                isDead = true;
                video.style.opacity = "0";
                ui.style.display = 'none';
                ctx.fillStyle = "black";
                ctx.globalCompositeOperation = 'destination-over';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                setTimeout(() => { message.style.opacity = "1"; }, 800);
            }
        }

        function drawFracture(x, y) {
            const lines = 12 + Math.random() * 8;
            
            for (let i = 0; i < lines; i++) {
                let currX = x, currY = y;
                let angle = (i / lines) * Math.PI * 2 + (Math.random() - 0.5);
                let segments = 6 + Math.random() * 6;

                // Path data to draw twice
                let points = [{x, y}];
                for (let j = 0; j < segments; j++) {
                    currX += Math.cos(angle) * (30 + Math.random() * 70);
                    currY += Math.sin(angle) * (30 + Math.random() * 70);
                    angle += (Math.random() - 0.5) * 0.8;
                    points.push({x: currX, y: currY});
                }

                // DRAW SHADOW (The depth)
                ctx.globalAlpha = 0.4;
                ctx.strokeStyle = "black";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(points[0].x + 1, points[0].y + 1);
                points.forEach(p => ctx.lineTo(p.x + 1, p.y + 1));
                ctx.stroke();

                // DRAW HIGHLIGHT (The sharp edge)
                ctx.globalAlpha = 0.9;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
                ctx.lineWidth = 0.7;
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                points.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.stroke();
            }

            // Small impact "star"
            ctx.fillStyle = "rgba(255,255,255,0.4)";
            ctx.beginPath();
            ctx.arc(x, y, 15, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawInkLeak(x, y) {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = "rgba(0,0,0,0.95)";
            for(let i=0; i<3; i++) {
                ctx.beginPath();
                ctx.arc(x + (Math.random()-0.5)*20, y + (Math.random()-0.5)*20, 10 + Math.random()*20, 0, Math.PI*2);
                ctx.fill();
            }
        }

        function drawChromaticLines(x) {
            const colors = ['#ff0055', '#00ffaa', '#0088ff', '#ffffff'];
            ctx.globalAlpha = 0.5;
            ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
            ctx.fillRect(x + (Math.random()-0.5)*150, 0, 1 + Math.random()*2, canvas.height);
        }
    </script>
</body>
</html>
