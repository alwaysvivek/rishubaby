<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Prism of You</title>
    <meta name="description" content="In a world of white light, you are the prism that shows me the truth.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@200;300;400;500&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: #1a1a1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        canvas#particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        canvas#particleCanvas.active {
            pointer-events: auto;
            cursor: crosshair;
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            pointer-events: auto;
        }

        /* === The Beam of Light === */
        .beam-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .beam-line {
            width: 2px;
            height: 80px;
            background: linear-gradient(to bottom,
                    transparent,
                    rgba(255, 255, 255, 0.05),
                    rgba(255, 255, 255, 0.4),
                    rgba(255, 255, 255, 0.9));
            transition: opacity 0.6s ease, height 0.6s ease;
        }

        .name-text {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: clamp(3rem, 8vw, 6rem);
            color: #ffffff;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.4),
                0 0 60px rgba(255, 255, 255, 0.15),
                0 0 100px rgba(255, 255, 255, 0.05);
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            user-select: none;
            position: relative;
        }

        .name-text::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.6),
                    transparent);
            transition: width 0.6s ease;
        }

        .beam-wrapper:hover .name-text::after {
            width: 100%;
        }

        .beam-wrapper:hover .name-text {
            text-shadow:
                0 0 30px rgba(255, 255, 255, 0.8),
                0 0 80px rgba(255, 255, 255, 0.4),
                0 0 120px rgba(255, 255, 255, 0.2);
        }

        /* Prism triangle */
        .prism {
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 50px solid rgba(255, 255, 255, 0.06);
            margin-top: 1rem;
            transition: all 0.6s ease;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.05));
            position: relative;
        }

        .beam-wrapper:hover .prism {
            border-bottom-color: rgba(255, 255, 255, 0.15);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.15));
        }

        /* Rainbow refraction lines */
        .refraction {
            position: absolute;
            bottom: -50px;
            left: 50%;
            width: 300px;
            height: 50px;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.8s ease;
            overflow: visible;
        }

        .beam-wrapper:hover .refraction {
            opacity: 1;
        }

        .refraction-line {
            position: absolute;
            top: 0;
            left: 50%;
            height: 2px;
            width: 0;
            transform-origin: 0% 50%;
            transition: width 0.8s ease;
            border-radius: 2px;
        }

        .beam-wrapper:hover .refraction-line {
            width: 120px;
        }

        .refraction-line:nth-child(1) {
            transform: rotate(-50deg);
            background: #ff4444;
            transition-delay: 0.05s;
        }

        .refraction-line:nth-child(2) {
            transform: rotate(-35deg);
            background: #ff8c00;
            transition-delay: 0.1s;
        }

        .refraction-line:nth-child(3) {
            transform: rotate(-20deg);
            background: #ffd700;
            transition-delay: 0.15s;
        }

        .refraction-line:nth-child(4) {
            transform: rotate(-5deg);
            background: #4dff4d;
            transition-delay: 0.2s;
        }

        .refraction-line:nth-child(5) {
            transform: rotate(10deg);
            background: #4dc9f6;
            transition-delay: 0.25s;
        }

        .refraction-line:nth-child(6) {
            transform: rotate(25deg);
            background: #6a5acd;
            transition-delay: 0.3s;
        }

        .refraction-line:nth-child(7) {
            transform: rotate(40deg);
            background: #9b59b6;
            transition-delay: 0.35s;
        }

        /* Hint text */
        .hint {
            font-family: 'Outfit', sans-serif;
            font-weight: 200;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            transition: opacity 0.5s ease;
            margin-top: 0.5rem;
        }

        /* === Activated State === */
        body.activated .beam-line {
            opacity: 0;
            height: 0;
        }

        body.activated .name-text {
            background: linear-gradient(90deg,
                    #ff4444, #ff8c00, #ffd700, #4dff4d,
                    #4dc9f6, #6a5acd, #9b59b6, #ff4444);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbow-text 4s linear infinite;
        }

        @keyframes rainbow-text {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        body.activated .prism {
            border-bottom-color: rgba(255, 255, 255, 0.25);
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.3));
            animation: prism-glow 2s ease-in-out infinite alternate;
        }

        @keyframes prism-glow {
            0% {
                filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.2));
            }

            100% {
                filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.5));
            }
        }

        body.activated .hint {
            opacity: 0;
        }

        /* === Motto === */
        .motto-container {
            position: fixed;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            text-align: center;
            opacity: 0;
            transition: opacity 1.2s ease 0.8s;
        }

        body.activated .motto-container {
            opacity: 1;
        }

        .motto {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-style: italic;
            font-size: clamp(0.85rem, 2vw, 1.15rem);
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 0.05em;
            line-height: 1.8;
            max-width: 600px;
        }

        .particle-hint {
            font-family: 'Outfit', sans-serif;
            font-weight: 200;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-top: 1rem;
            opacity: 0;
            transition: opacity 1s ease 2s;
        }

        body.activated .particle-hint {
            opacity: 1;
        }

        /* === Meaning Tooltip === */
        .meaning-tooltip {
            position: fixed;
            z-index: 10;
            background: rgba(15, 15, 18, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            max-width: 260px;
            text-align: center;
        }

        .meaning-tooltip.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .meaning-color-name {
            font-family: 'Outfit', sans-serif;
            font-weight: 400;
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .meaning-text {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-style: italic;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.5;
        }

        /* === Rainbow Burst Background === */
        .rainbow-burst {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            z-index: 0;
            opacity: 0;
            transition: none;
            background: conic-gradient(from 0deg,
                    rgba(255, 68, 68, 0.08),
                    rgba(255, 140, 0, 0.08),
                    rgba(255, 215, 0, 0.08),
                    rgba(77, 255, 77, 0.08),
                    rgba(77, 201, 246, 0.08),
                    rgba(106, 90, 205, 0.08),
                    rgba(155, 89, 182, 0.08),
                    rgba(255, 68, 68, 0.08));
        }

        body.activated .rainbow-burst {
            animation: burst-expand 1.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes burst-expand {
            0% {
                width: 0;
                height: 0;
                opacity: 0;
                transform: translate(-50%, -50%);
            }

            50% {
                opacity: 1;
            }

            100% {
                width: 200vmax;
                height: 200vmax;
                opacity: 0.6;
                transform: translate(-50%, -50%);
            }
        }

        /* Subtle ambient animation for the background after activation */
        body.activated {
            background: radial-gradient(ellipse at center,
                    #1e1e24 0%,
                    #1a1a1e 50%,
                    #151518 100%);
        }
    </style>
</head>

<body>

    <div class="rainbow-burst"></div>

    <canvas id="particleCanvas"></canvas>

    <div class="container">
        <div class="beam-wrapper" id="beamWrapper">
            <div class="beam-line"></div>
            <div class="name-text" id="nameText">Rishu</div>
            <div class="prism">
                <div class="refraction">
                    <div class="refraction-line"></div>
                    <div class="refraction-line"></div>
                    <div class="refraction-line"></div>
                    <div class="refraction-line"></div>
                    <div class="refraction-line"></div>
                    <div class="refraction-line"></div>
                    <div class="refraction-line"></div>
                </div>
            </div>
            <div class="hint">click to refract</div>
        </div>
    </div>

    <div class="motto-container">
        <div class="motto">"In a world of white light, you are the prism that shows me the truth."</div>
        <div class="particle-hint">click the colors to discover their meaning</div>
    </div>

    <div class="meaning-tooltip" id="meaningTooltip">
        <div class="meaning-color-name" id="tooltipColorName"></div>
        <div class="meaning-text" id="tooltipText"></div>
    </div>

    <script>
        // ============================================================
        //  CONFIG
        // ============================================================
        const COLORS = [
            { color: '#ff4444', name: 'Red', meaning: 'The fire you light inside me' },
            { color: '#ff8c00', name: 'Orange', meaning: 'The warmth of your laughter' },
            { color: '#ffd700', name: 'Yellow', meaning: 'Your smile — my sun' },
            { color: '#4dff4d', name: 'Green', meaning: 'The growth we nurture together' },
            { color: '#4dc9f6', name: 'Blue', meaning: 'The calm you bring to my chaos' },
            { color: '#6a5acd', name: 'Indigo', meaning: 'The depth of what I feel' },
            { color: '#9b59b6', name: 'Violet', meaning: 'Our strength — rare and unbreakable' },
        ];

        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('meaningTooltip');
        const tooltipColorName = document.getElementById('tooltipColorName');
        const tooltipText = document.getElementById('tooltipText');

        let W, H;
        let particles = [];
        let activated = false;
        let tooltipTimer = null;

        // ============================================================
        //  CANVAS RESIZE
        // ============================================================
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // ============================================================
        //  PARTICLE CLASS
        // ============================================================
        class Particle {
            constructor(x, y, colorObj, delay) {
                this.originX = x;
                this.originY = y;
                this.x = x;
                this.y = y;
                this.colorObj = colorObj;
                this.color = colorObj.color;

                const angle = Math.random() * Math.PI * 2;
                const speed = 1.5 + Math.random() * 4;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;

                this.radius = 3 + Math.random() * 5;
                this.baseRadius = this.radius;
                this.alpha = 0;
                this.targetAlpha = 0.6 + Math.random() * 0.4;
                this.life = 1;
                this.delay = delay;
                this.elapsed = 0;

                // Orbit / floating behavior
                this.orbitAngle = Math.random() * Math.PI * 2;
                this.orbitSpeed = 0.003 + Math.random() * 0.008;
                this.orbitRadius = 0.5 + Math.random() * 1.5;
                this.settled = false;
                this.settleX = 0;
                this.settleY = 0;

                // Hover state
                this.hovered = false;
                this.glowRadius = 0;
            }

            update(dt) {
                this.elapsed += dt;
                if (this.elapsed < this.delay) return;

                if (!this.settled) {
                    // Expansion phase
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.985;
                    this.vy *= 0.985;
                    this.alpha += (this.targetAlpha - this.alpha) * 0.05;

                    if (Math.abs(this.vx) < 0.15 && Math.abs(this.vy) < 0.15) {
                        this.settled = true;
                        this.settleX = this.x;
                        this.settleY = this.y;
                    }
                } else {
                    // Gentle floating
                    this.orbitAngle += this.orbitSpeed;
                    this.x = this.settleX + Math.cos(this.orbitAngle) * this.orbitRadius;
                    this.y = this.settleY + Math.sin(this.orbitAngle) * this.orbitRadius;
                }

                // Hover glow
                if (this.hovered) {
                    this.glowRadius += (this.baseRadius * 3 - this.glowRadius) * 0.1;
                    this.radius += (this.baseRadius * 1.6 - this.radius) * 0.1;
                } else {
                    this.glowRadius += (0 - this.glowRadius) * 0.08;
                    this.radius += (this.baseRadius - this.radius) * 0.08;
                }
            }

            draw(ctx) {
                if (this.elapsed < this.delay) return;

                // Outer glow
                if (this.glowRadius > 0.5) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.glowRadius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color.replace(')', `, ${this.alpha * 0.15})`).replace('rgb', 'rgba');
                    // Simple hex to rgba
                    const r = parseInt(this.color.slice(1, 3), 16);
                    const g = parseInt(this.color.slice(3, 5), 16);
                    const b = parseInt(this.color.slice(5, 7), 16);
                    ctx.fillStyle = `rgba(${r},${g},${b},${this.alpha * 0.12})`;
                    ctx.fill();
                }

                // Core particle
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                const r = parseInt(this.color.slice(1, 3), 16);
                const g = parseInt(this.color.slice(3, 5), 16);
                const b = parseInt(this.color.slice(5, 7), 16);
                ctx.fillStyle = `rgba(${r},${g},${b},${this.alpha})`;
                ctx.fill();
            }

            contains(mx, my) {
                const hitRadius = Math.max(this.radius, 14); // generous hit area
                const dx = this.x - mx;
                const dy = this.y - my;
                return dx * dx + dy * dy < hitRadius * hitRadius;
            }
        }

        // ============================================================
        //  SPAWN PARTICLES
        // ============================================================
        function spawnParticles() {
            particles = [];
            const cx = W / 2;
            const cy = H / 2;
            const total = 220;

            for (let i = 0; i < total; i++) {
                const colorObj = COLORS[i % COLORS.length];
                const delay = Math.random() * 600; // stagger
                const p = new Particle(cx, cy, colorObj, delay);

                // Spread more outward
                const angle = (i / total) * Math.PI * 2 + (Math.random() - 0.5) * 0.8;
                const speed = 2.5 + Math.random() * 5;
                p.vx = Math.cos(angle) * speed;
                p.vy = Math.sin(angle) * speed;

                particles.push(p);
            }
        }

        // ============================================================
        //  ANIMATION LOOP
        // ============================================================
        let lastTime = 0;
        function animate(time) {
            const dt = Math.min(time - lastTime, 50);
            lastTime = time;

            ctx.clearRect(0, 0, W, H);

            if (activated) {
                for (const p of particles) {
                    p.update(dt);
                    p.draw(ctx);
                }
            }

            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        // ============================================================
        //  ACTIVATION
        // ============================================================
        const beamWrapper = document.getElementById('beamWrapper');

        beamWrapper.addEventListener('click', () => {
            if (activated) return;
            activated = true;
            document.body.classList.add('activated');
            canvas.classList.add('active');

            spawnParticles();
        });

        // ============================================================
        //  PARTICLE INTERACTION
        // ============================================================
        let hoveredParticle = null;

        canvas.addEventListener('mousemove', (e) => {
            if (!activated) return;
            const mx = e.clientX;
            const my = e.clientY;

            let found = null;
            // Check from top (last drawn) to bottom
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                if (p.settled && p.contains(mx, my)) {
                    found = p;
                    break;
                }
            }

            // Reset previous
            if (hoveredParticle && hoveredParticle !== found) {
                hoveredParticle.hovered = false;
            }

            if (found) {
                found.hovered = true;
                hoveredParticle = found;
                canvas.style.cursor = 'pointer';
            } else {
                hoveredParticle = null;
                canvas.style.cursor = 'crosshair';
            }
        });

        canvas.addEventListener('click', (e) => {
            if (!activated) return;
            const mx = e.clientX;
            const my = e.clientY;

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                if (p.settled && p.contains(mx, my)) {
                    showMeaning(p, mx, my);
                    return;
                }
            }

            // Clicked empty space, hide tooltip
            hideMeaning();
        });

        function showMeaning(particle, mx, my) {
            clearTimeout(tooltipTimer);

            const r = parseInt(particle.color.slice(1, 3), 16);
            const g = parseInt(particle.color.slice(3, 5), 16);
            const b = parseInt(particle.color.slice(5, 7), 16);

            tooltipColorName.textContent = particle.colorObj.name;
            tooltipColorName.style.color = particle.color;
            tooltipText.textContent = `"${particle.colorObj.meaning}"`;

            tooltip.style.borderColor = `rgba(${r},${g},${b},0.25)`;

            // Position tooltip
            let tx = mx + 20;
            let ty = my - 30;

            // Prevent overflow
            const tw = 260;
            if (tx + tw > W - 20) tx = mx - tw - 20;
            if (ty < 20) ty = 20;
            if (ty + 100 > H - 20) ty = H - 120;

            tooltip.style.left = tx + 'px';
            tooltip.style.top = ty + 'px';
            tooltip.classList.add('visible');

            // Auto-hide after 3s
            tooltipTimer = setTimeout(hideMeaning, 3500);
        }

        function hideMeaning() {
            tooltip.classList.remove('visible');
        }

        // ============================================================
        //  TOUCH SUPPORT
        // ============================================================
        canvas.addEventListener('touchstart', (e) => {
            if (!activated) return;
            e.preventDefault();
            const touch = e.touches[0];
            const mx = touch.clientX;
            const my = touch.clientY;

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                if (p.settled && p.contains(mx, my)) {
                    showMeaning(p, mx, my);
                    return;
                }
            }
            hideMeaning();
        }, { passive: false });
    </script>

</body>

</html>
