<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chocolate Day for Rishu 🍫❤️</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Georgia', serif;
        }

        #webcam_video {
            position: absolute;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: -1;
        }

        #ui-layer {
            position: absolute;
            top: 5%;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            color: #f3e5ab;
            font-size: 1.8rem;
            text-shadow: 0 0 10px #000;
            margin: 0;
        }

        #stats-layer {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #ff4d6d;
            color: #fff;
            font-size: 0.9rem;
        }

        #feedback-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 4rem;
            font-weight: bold;
            opacity: 0;
            z-index: 20;
            text-shadow: 0 0 20px #d2691e;
            pointer-events: none;
        }

        .bite-pop {
            animation: biteAnim 0.4s ease-out;
        }

        @keyframes biteAnim {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }

            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1);
            }
        }
    </style>
</head>

<body>

    <video id="webcam_video" playsinline></video>

    <div id="ui-layer">
        <h1 id="title">🍫 Take a bite, Rishu! ❤️</h1>
        <div id="stats-layer">
            <div class="stat-box">Bites: <span id="bite-count">0</span>/5</div>
            <div class="stat-box">Slabs: <span id="slab-count">0</span>/2</div>
        </div>
    </div>

    <div id="feedback-text">NOM! 😋</div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        let scene, camera, renderer, particles;
        let handL = new THREE.Vector3(-100, 0, 0), handR = new THREE.Vector3(-100, 0, 0);
        let mouthPos = new THREE.Vector3(0, 0, 0);
        let isPinchingL = false, isPinchingR = false;
        let mouthOpen = false;

        let state = 'whole';
        let bitesTaken = 0;
        let slabsFinished = 0;
        let biteCooldown = false;

        const PART_COUNT = 15000;
        const basePos = new Float32Array(PART_COUNT * 3);
        const vels = new Float32Array(PART_COUNT * 3);
        const isEaten = new Uint8Array(PART_COUNT);

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(PART_COUNT * 3);
            const cols = new Float32Array(PART_COUNT * 3);

            for (let i = 0; i < PART_COUNT; i++) {
                pos[i * 3] = (Math.random() - 0.5) * 8;
                pos[i * 3 + 1] = (Math.random() - 0.5) * 5;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
                basePos[i * 3] = pos[i * 3];
                basePos[i * 3 + 1] = pos[i * 3 + 1];
                basePos[i * 3 + 2] = pos[i * 3 + 2];
                new THREE.Color(i % 2 === 0 ? 0x3d1c02 : 0x5c2e0a).toArray(cols, i * 3);
                isEaten[i] = 0;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
            particles = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.18, vertexColors: true }));
            scene.add(particles);
        }

        const video = document.getElementById('webcam_video');
        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });

        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5 });
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });

        hands.onResults((results) => {
            isPinchingL = false; isPinchingR = false;
            if (results.multiHandLandmarks) {
                results.multiHandLandmarks.forEach((lm, index) => {
                    const x = (lm[8].x - 0.5) * -28;
                    const y = (lm[8].y - 0.5) * -20;
                    const grabbing = Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y) < 0.12;
                    if (index === 0) { handL.set(x, y, 0); isPinchingL = grabbing; }
                    else { handR.set(x, y, 0); isPinchingR = grabbing; }
                });
            }
        });

        faceMesh.onResults((results) => {
            if (results.multiFaceLandmarks?.[0]) {
                const face = results.multiFaceLandmarks[0];
                const topLip = face[13];
                const botLip = face[14];
                mouthOpen = Math.abs(topLip.y - botLip.y) > 0.045;
                mouthPos.set((face[13].x - 0.5) * -28, (face[13].y - 0.5) * -20, 0);
            }
        });

        const cameraFeed = new Camera(video, {
            onFrame: async () => {
                await hands.send({ image: video });
                await faceMesh.send({ image: video });
            },
            width: 1280, height: 720
        });
        cameraFeed.start();

        function processBite() {
            if (biteCooldown || !mouthOpen || state === 'heart') return;

            const distToMouth = particles.position.distanceTo(mouthPos);
            if (distToMouth < 6) {
                biteCooldown = true;
                bitesTaken++;
                document.getElementById('bite-count').innerText = bitesTaken;

                // Visual Shake
                const originalPos = particles.position.clone();
                let shakeCount = 0;
                const shakeInterval = setInterval(() => {
                    particles.position.x += (Math.random() - 0.5) * 1.5;
                    particles.position.y += (Math.random() - 0.5) * 1.5;
                    shakeCount++;
                    if (shakeCount > 4) {
                        clearInterval(shakeInterval);
                        particles.position.copy(originalPos);
                    }
                }, 20);

                const fb = document.getElementById('feedback-text');
                fb.classList.remove('bite-pop'); void fb.offsetWidth; fb.classList.add('bite-pop');

                const p = particles.geometry.attributes.position.array;
                const worldMouth = mouthPos.clone().sub(particles.position);

                for (let i = 0; i < PART_COUNT; i++) {
                    if (isEaten[i]) continue;
                    const px = p[i * 3], py = p[i * 3 + 1];
                    const d = Math.sqrt(Math.pow(px - worldMouth.x, 2) + Math.pow(py - worldMouth.y, 2));
                    if (d < 2.5) {
                        isEaten[i] = 1;
                        vels[i * 3] = (px - worldMouth.x) * 0.4;
                        vels[i * 3 + 1] = (py - worldMouth.y) * 0.4;
                    }
                }
                particles.geometry.attributes.position.needsUpdate = true;

                if (bitesTaken >= 5) {
                    slabsFinished++;
                    document.getElementById('slab-count').innerText = slabsFinished;
                    bitesTaken = 0;
                    document.getElementById('bite-count').innerText = "0";
                    setTimeout(() => {
                        if (slabsFinished >= 2) triggerFinalHeart();
                        else resetSlab();
                    }, 800);
                }
                setTimeout(() => { biteCooldown = false; }, 800);
            }
        }

        function resetSlab() {
            const p = particles.geometry.attributes.position.array;
            for (let i = 0; i < PART_COUNT; i++) {
                p[i * 3] = basePos[i * 3]; p[i * 3 + 1] = basePos[i * 3 + 1]; p[i * 3 + 2] = basePos[i * 3 + 2];
                vels[i * 3] = 0; vels[i * 3 + 1] = 0; isEaten[i] = 0;
            }
            particles.geometry.attributes.position.needsUpdate = true;
        }

        function triggerFinalHeart() {
            state = 'heart';
            document.getElementById('title').innerText = "Happy Chocolate Day Rishu! ❤️";
            const c = particles.geometry.attributes.color.array;
            for (let i = 0; i < PART_COUNT; i++) {
                const t = Math.random() * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                basePos[i * 3] = x * 0.45; basePos[i * 3 + 1] = y * 0.45; basePos[i * 3 + 2] = (Math.random() - 0.5) * 2;
                isEaten[i] = 0;
                new THREE.Color(i % 2 === 0 ? 0xffd700 : 0xff4d6d).toArray(c, i * 3);
            }
            particles.geometry.attributes.color.needsUpdate = true;
            resetSlab();
        }

        function animate() {
            requestAnimationFrame(animate);
            const pos = particles.geometry.attributes.position.array;
            processBite();

            if (state === 'whole' || state === 'heart') {
                if (isPinchingL) particles.position.lerp(handL, 0.35);
                else if (isPinchingR) particles.position.lerp(handR, 0.35);
                else particles.position.lerp(new THREE.Vector3(0, 0, 0), 0.1);

                for (let i = 0; i < PART_COUNT; i++) {
                    if (isEaten[i]) {
                        pos[i * 3] += vels[i * 3];
                        pos[i * 3 + 1] += vels[i * 3 + 1];
                        vels[i * 3 + 1] -= 0.012;
                    }
                }
                particles.geometry.attributes.position.needsUpdate = true;
            }
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>

</html>
