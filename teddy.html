<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teddy Day for Rishu 🧸❤️</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            cursor: none;
        }

        #webcam_video {
            position: absolute;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 1;
            transition: opacity 2s ease-in-out;
        }

        #ui-overlay {
            position: absolute;
            bottom: 8%;
            width: 100%;
            text-align: center;
            color: #fff;
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            font-family: 'Georgia', serif;
            font-size: 2.2rem;
            color: #ffb7c5;
            text-shadow: 0 0 25px rgba(255, 183, 197, 0.8);
            opacity: 0;
            transition: 2.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .active-text {
            opacity: 1;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <video id="webcam_video" playsinline></video>
    <canvas id="temp_canvas" style="display:none;"></canvas>

    <div id="ui-overlay">
        <h1 id="main-text">My fav teddy is Rishu! Happy Teddy Day ❤️</h1>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        let scene, camera, renderer, particles, geometry;
        let video, canvas, ctx;
        let handL = new THREE.Vector3(-100, 0, 0), handR = new THREE.Vector3(-100, 0, 0);
        let isTransitioned = false;
        let time = 0;

        const gridW = 320;
        const gridH = 240;
        const PARTICLE_COUNT = gridW * gridH;

        const posArray = new Float32Array(PARTICLE_COUNT * 3);
        const homeArray = new Float32Array(PARTICLE_COUNT * 3);
        const colArray = new Float32Array(PARTICLE_COUNT * 3);
        const velArray = new Float32Array(PARTICLE_COUNT * 3);

        async function init() {
            video = document.getElementById('webcam_video');
            canvas = document.getElementById('temp_canvas');
            canvas.width = gridW; canvas.height = gridH;
            ctx = canvas.getContext('2d');

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = 'a.jpg';

            img.onload = () => {
                ctx.drawImage(img, 0, 0, gridW, gridH);
                const imgData = ctx.getImageData(0, 0, gridW, gridH).data;
                setupThreeJS();
                mapParticles(imgData);
                startCamera();
            };
        }

        function setupThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 35;
            renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);
        }

        function mapParticles(imgData) {
            geometry = new THREE.BufferGeometry();
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3, i4 = i * 4;
                const x = i % gridW, y = Math.floor(i / gridW);
                const hX = (x / gridW - 0.5) * 45;
                const hY = (y / gridH - 0.5) * -35;

                homeArray[i3] = hX; homeArray[i3 + 1] = hY; homeArray[i3 + 2] = 0;
                posArray[i3] = hX; posArray[i3 + 1] = hY; posArray[i3 + 2] = 0;
                colArray[i3] = imgData[i4] / 255; colArray[i3 + 1] = imgData[i4 + 1] / 255; colArray[i3 + 2] = imgData[i4 + 2] / 255;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colArray, 3));

            // Using a soft circular sprite for the "Stardust" feel
            const material = new THREE.PointsMaterial({
                size: 0.14,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
            animate();
        }

        async function startCamera() {
            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5 });
            hands.onResults((results) => {
                handL.set(-100, 0, 0); handR.set(-100, 0, 0);
                if (results.multiHandLandmarks) {
                    results.multiHandLandmarks.forEach((lm, idx) => {
                        const target = idx === 0 ? handL : handR;
                        target.set((0.5 - lm[8].x) * 55, (0.5 - lm[8].y) * 45, 0);
                    });
                }
            });

            const cameraPipe = new Camera(video, {
                onFrame: async () => { await hands.send({ image: video }); },
                width: 640, height: 480
            });
            cameraPipe.start();

            setTimeout(() => {
                video.style.opacity = "0";
                isTransitioned = true;
                document.getElementById('main-text').classList.add('active-text');
            }, 3000);
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.015;

            if (isTransitioned && particles) {
                const pos = geometry.attributes.position.array;
                const centerHand = new THREE.Vector3().addVectors(handL, handR).multiplyScalar(0.5);
                const distBetweenHands = handL.distanceTo(handR);
                const isTwoHands = handL.x > -50 && handR.x > -50;

                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const i3 = i * 3;

                    // Interaction 1: Individual hand repulsion (Pushing with a stardust trail)
                    [handL, handR].forEach(h => {
                        if (h.x < -50) return;
                        const dx = pos[i3] - h.x;
                        const dy = pos[i3 + 1] - h.y;
                        const d = Math.sqrt(dx * dx + dy * dy);
                        if (d < 6) {
                            const force = (6 - d) * 0.18;
                            velArray[i3] += dx * force;
                            velArray[i3 + 1] += dy * force;
                            // Add a slight Z-pop for depth
                            velArray[i3 + 2] += force * 0.5;
                        }
                    });

                    // Interaction 2: Gravity Pull (Heart Magnet)
                    if (isTwoHands && distBetweenHands < 12) {
                        const d = Math.sqrt(Math.pow(pos[i3] - centerHand.x, 2) + Math.pow(pos[i3 + 1] - centerHand.y, 2));
                        if (d < 18) {
                            const pull = (18 - d) * 0.025;
                            velArray[i3] -= (pos[i3] - centerHand.x) * pull;
                            velArray[i3 + 1] -= (pos[i3 + 1] - centerHand.y) * pull;
                        }
                    }

                    // Physics & The "Shimmer" (Magic Movement)
                    const shimmer = Math.sin(time + i) * 0.005;

                    pos[i3] += velArray[i3] + (homeArray[i3] - pos[i3]) * 0.1 + shimmer;
                    pos[i3 + 1] += velArray[i3 + 1] + (homeArray[i3 + 1] - pos[i3 + 1]) * 0.1 + shimmer;
                    pos[i3 + 2] += velArray[i3 + 2] + (0 - pos[i3 + 2]) * 0.1;

                    velArray[i3] *= 0.84;
                    velArray[i3 + 1] *= 0.84;
                    velArray[i3 + 2] *= 0.84;
                }
                geometry.attributes.position.needsUpdate = true;
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('load', init);
    </script>
</body>

</html>
